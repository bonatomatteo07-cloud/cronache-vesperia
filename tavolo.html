      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i]; p.life++; p.x += p.vx + Math.sin((p.life + i) * .03) * .3; p.y += p.vy; p.vy *= .999;
        const a = Math.sin(Math.PI * Math.min(1, p.life / p.max));
        if (p.life > p.max || p.y < -20) { P.splice(i, 1); continue; }
        ctx.beginPath(); ctx.fillStyle = p.gold ? `hsla(44,90%,72%,${a * .9})` : `hsla(${p.hue},95%,58%,${a * .85})`;
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8; ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      requestAnimationFrame(step);
    };
    step();
    return { burst: n => { for (let i = 0; i < n; i++) spawn(true); }, stop: () => { run = false; removeEventListener("resize", size); } };
  }
  // opts: { music: nome traccia, sub: sottotitolo, cta: testo del pulsante finale }
  function show(opts = {}) {
    if (open || window.__FAST) return Promise.resolve();
    open = true;
    return new Promise(done => {
      const t = document.createElement("div"); t.className = "tt"; t.id = "titolo";
      const word = "Vesperia";
      t.innerHTML = `<div class="tt-art"><img class="w" src="${IMG.key_wide || ""}" alt=""><img class="t" src="${IMG.key_tall || ""}" alt=""></div>
        <div class="tt-rays"></div><div class="tt-fog"></div><canvas class="tt-fx"></canvas><div class="tt-vign"></div>
        <div class="tt-logo"><div class="tt-pre">Cronache di</div><h1>${[...word].map((c, i) => `<span style="--i:${i}">${c}</span>`).join("")}</h1>
          <div class="tt-line"><i></i></div><div class="tt-sigs">${SIG.map((s, i) => `<b style="--i:${i}">${s}</b>`).join("")}</div>
          <div class="tt-sub">${opts.sub || "Sette Reliquie. Un dio senza nome. Una catena che cede."}</div></div>
        <button class="tt-tap" type="button"><span>Tocca per iniziare</span></button>
        <button class="tt-go btn main" type="button">${opts.cta || "Entra"}</button>
        <button class="tt-skip linkbtn" type="button">Salta</button><div class="tt-flash"></div>`;
      document.body.appendChild(t);
      const fx = sparks(t.querySelector(".tt-fx"));
      requestAnimationFrame(() => t.classList.add("s0"));
      let started = false, timers = [];
      const at = (ms, f) => timers.push(setTimeout(f, ms));
      const reveal = () => {
        if (started) return; started = true;
        try { window.__tac && window.__tac.resume && window.__tac.resume(); } catch (e) {}
        if (opts.music) MUSICA.play(opts.music, .55);
        t.classList.add("s1"); boom(); fx.burst(60);
        at(900, () => t.classList.add("s2"));                                   // il titolo sale dalle braci
        [...word].forEach((_, i) => at(1100 + i * 110, () => tone(520 + i * 40, .5, "triangle", .03)));
        at(2300, () => { t.classList.add("s3"); tone(196, 2.4, "sine", .07); }); // la lama di luce
        SIG.forEach((_, i) => at(2700 + i * 260, () => tone([392, 440, 494, 523, 587, 659, 784][i], 1.4, "sine", .045)));
        at(4800, () => t.classList.add("s4"));                                  // sottotitolo e pulsante
      };
      const close = () => {
        timers.forEach(clearTimeout); t.classList.add("out"); fx.burst(40);
        setTimeout(() => { fx.stop(); t.remove(); open = false; done(); }, 900);
      };
      t.querySelector(".tt-tap").onclick = reveal;
      t.addEventListener("click", e => { if (!started && !e.target.closest(".tt-skip")) reveal(); });
      t.querySelector(".tt-go").onclick = e => { e.stopPropagation(); close(); };
      t.querySelector(".tt-skip").onclick = e => { e.stopPropagation(); if (!started) { if (opts.music) MUSICA.play(opts.music, .55); } close(); };
    });
  }
  return { show, get open() { return open; } };
})();

const NARR={"p_prologo": {"t": "Vesperia vive la sera della propria era. Il fuoco di Pyrath, il dio che forgiò il mondo, si è spento. Le sette Reliquie degli dei si sono disperse. E sotto le radici del mondo, una catena antica comincia a cedere.\n\nQuella catena tiene prigioniero un dio che nessuno ricorda più: l'ottavo, il Re Affamato. Il suo nome è stato cancellato. La sua fame, no.\n\nNessuno sa ancora cosa sta per accadere. Nessuno, tranne una vecchia guerriera con una lanterna, che da sessant'anni porta un peso che non ha mai confessato. Una notte ha chiesto a Pyrath un'ultima grazia: trovarle qualcuno di cui fidarsi. E il dio, con le sue ultime forze, ha mandato un sogno.\n\nLo avete sognato tutti, in terre lontane. Una città costruita sui ponti. Una locanda dal nome d'ambra. Il vostro dio, proprio il vostro, che vi indicava la strada.\n\nCosì siete partiti, ognuno con una ragione sua: un debito, una caccia, una preghiera rimasta senza risposta. Nessuno di voi sa perché è venuto davvero.\n\nMa stasera, a Crocevento, la Città dei Ponti, sedete tutti allo stesso tavolo del Corno d'Ambra. L'oste versa il vino. Qualcuno ride. In un angolo, una figura incappucciata vi osserva senza dire una parola.\n\nPoi, fuori, comincia a cadere la cenere. E il fiume... si ferma."}, "c1_attacco": {"t": "Suonano le campane. Le finestre del Corno d'Ambra esplodono e dentro entrano i primi Divorati: creature grigie, svuotate dalla fame, con bocche troppo larghe per essere umane.\n\nQuesto è il vostro primo scontro. Ognuno tira il dado da venti per l'iniziativa: chi ottiene di più agisce per primo. Nel vostro turno avete due azioni: potete attaccare, usare l'abilità della vostra classe, invocare la benedizione del vostro dio, oppure aiutare un compagno.\n\nIl vostro obiettivo, stanotte, è raggiungere il Tempio del Braciere, dall'altra parte della città, prima che la brace della lanterna si spenga."}, "z_mercato": {"t": "Il Mercato dei Venti. Le bancarelle sono rovesciate, le banderuole girano impazzite, come se il vento non sapesse più da dove soffiare. Tra le casse sfondate, due Famelici frugano in cerca di qualcosa da mangiare. Poi alzano la testa. Hanno trovato voi."}, "z_santuario": {"t": "Il Santuario di Zarek. La statua dal doppio volto vi guarda: una faccia ride, l'altra piange. Ai suoi piedi, monete e dadi lasciati dai fedeli. Qui i Divorati non entrano: forse anche la fame ha paura di perdere a dadi. Cercate bene. Zarek, a volte, lascia un dono a chi osa."}, "z_vicoli": {"t": "I Vicoli dei Pescatori. Reti strappate, passerelle sull'acqua immobile. È il quartiere più povero di Crocevento, dove fino a ieri qualcuno distribuiva pane gratis. Ora, tra le ombre, si muove qualcosa che quel pane l'ha mangiato."}, "z_porta": {"t": "La Porta del Nord. La saracinesca è sfondata, e il ferro è piegato verso l'esterno: qualcuno l'ha aperta da dentro. Davanti a voi un Mangiaossa, lento e corazzato, si volta. Ha sentito il vostro odore."}, "z_moli": {"t": "I Moli. Le barche sono ferme su un fiume che non scorre più, e l'acqua è liscia come vetro nero. Sopra, uno sciame di Locuste d'ombra ronza in cerchio. Stava aspettando proprio voi."}, "z_piazza": {"t": "La Piazza dei Crocicchi, il cuore di Crocevento. Quattro strade e una rosa dei venti incisa nel selciato. Ha otto punte, non sette, e nessuno ricorda perché. Ma ora non c'è tempo per gli enigmi: i Divorati sbarrano tutte le vie."}, "z_ponte": {"t": "Il Ponte Vecchio. Tra le case costruite sul ponte, decine di cittadini sono intrappolati e gridano aiuto. Sono profughi delle Colline di Melodoro, fuggiti dalla carestia per finire nella bocca della fame. Se liberate il ponte, si salveranno. E non dimenticheranno i vostri volti."}, "z_tempio": {"t": "Il Tempio del Braciere. Il Braciere Eterno arde ancora, al centro della sala, e per un istante il suo calore vi fa sperare. Poi il pavimento trema."}, "vorgath_t": {"t": "Un gigante con la corona spezzata affonda le mani nel Braciere Eterno e lo divora. La città piomba nel buio. Questo è Vorgath, il Primo Araldo della Fame.\n\nNon potete vincerlo, stanotte. Potete solo resistere: sopravvivete per due giri."}, "vorgath_h": {"t": "La brace della lanterna è quasi spenta, e la fame vi ha trovati. Dal fumo emerge un gigante con la corona spezzata e una bocca dove dovrebbe esserci il ventre: Vorgath, il Primo Araldo.\n\nNon potete vincerlo, stanotte. Potete solo resistere: sopravvivete per due giri."}, "c1_seraphel": {"t": "Quando tutto sembra perduto, una vecchia guerriera alza una lanterna. Dentro arde un'unica brace. La fiammata investe Vorgath, che arretra urlando e fugge oltre la Porta del Nord. Lei abbassa la lanterna e vi guarda.\n\n«La fame teme il fuoco. Ma questa è l'ultima brace di Pyrath… e non durerà per sempre.»"}, "c1_fine": {"t": "Tra le rovine fumanti, la donna si presenta: Seraphel Velocenere, l'ultima Custode della Fiamma. Vi racconta di una catena forgiata con sette Reliquie, una per ogni dio, e di un prigioniero che non deve uscire. Le Reliquie si sono disperse quando il fuoco di Pyrath si è spento, e ritrovarle è l'unico modo per salvare Vesperia.\n\n«Gli dei vi hanno mandati qui per una ragione» dice. «Ora sapete quale.»\n\nQuella notte, davanti al Braciere spento, nasce la compagnia."}, "i12": {"t": "La Notte delle Fauci è finita. Crocevento conta i suoi morti, e il Consiglio dei Ponti cerca già un colpevole.\n\nSeraphel non aspetta. All'alba guida la compagnia verso ovest, risalendo la Vena, fino al margine della Selva Antica: la foresta sacra a Sylvara, la Madre Cerva. Lì, nel tronco del Primo Albero, riposa il Seme, la prima delle sette Reliquie.\n\nMa la Selva sta marcendo dalle radici. E sotto quelle radici, qualcosa ha fame."}, "c2_livello": {"t": "Il viaggio vi ha cambiati. Avete più vita, e le vostre armi colpiscono più forte. E uno di voi, quello che a Crocevento ha colpito più duro, è già un passo avanti agli altri."}, "c2_congedo": {"t": "Al Limitare, Seraphel si ferma.\n\n«La mia brace è troppo debole per questi alberi: qui il fuoco farebbe più male che bene.» Vi affida la lanterna. «Una sola fiammata. Usatela bene. Tornate con il Seme, e tornate vivi.»"}, "c2_regole": {"t": "Ascoltate bene, perché la Selva non vi aspetterà.\n\nIl marciume parte dal Cuore della Selva, nell'angolo opposto della mappa, e ogni quattro giri si allarga di una zona verso di voi. Entrare in una zona marcia costa vita, e lì i nemici colpiscono più forte. Se il marciume raggiunge il Limitare, sarà il Cervo Marcio a trovare voi.\n\nIl vostro obiettivo è il Cuore. Lungo la strada potete chiedere aiuto agli elfi di Lunargento, ascoltare gli gnomi e purificare il santuario di Sylvara. Ma ogni deviazione costa tempo."}, "sb_arrivo": {"t": "Proprio mentre state per entrare nella foresta, un carretto sgangherato sbuca dal sentiero, inciampa su una radice e si rovescia. Ne rotola fuori un goblin. Si rialza, si spolvera, e vi guarda con l'aria di chi ha già capito come andrà a finire."}, "sb_hello1": {"t": "«Ah. Eroi. Ovunque vada io, arrivate voi, e subito dopo qualcosa prende fuoco.»"}, "sb_hello2": {"t": "«Sono qui per caso. Sono sempre qui per caso. È il mio unico talento.»"}, "sb_hello3": {"t": "«Selva maledetta, marciume, un cervo posseduto. E io che volevo solo vendere due ampolle a Crocevento.»"}, "c2_voto": {"t": "Prima di comprare, la compagnia deve scegliere chi terrà la borsa: cinquanta monete d'oro, tutto ciò che avete. Il tesoriere comprerà dal mercante e distribuirà gli oggetti. Votate."}, "sb_voto": {"t": "«Scegliete bene chi tiene la borsa. L'ultimo tesoriere che ho conosciuto ora è un fungo.»"}, "sb_pozione1": {"t": "«Una pozione. Saggio. Morire costa caro, curarsi un po' meno.»"}, "sb_pozione2": {"t": "«Agitare prima dell'uso. O dopo. Tanto il sapore resta quello.»"}, "sb_pozione3": {"t": "«Ottima scelta. L'ultimo che l'ha rifiutata ora concima un fungo.»"}, "sb_bomba1": {"t": "«Bombe. In una foresta. Cosa mai potrebbe andare storto.»"}, "sb_bomba2": {"t": "«Lanciatela lontano. Più lontano. No, ancora più lontano di così.»"}, "sb_bomba3": {"t": "«Se prende fuoco il bosco, io non vi ho mai visti.»"}, "sb_povero1": {"t": "«Niente oro, niente merce. Anche la fine del mondo ha i suoi principi.»"}, "sb_povero2": {"t": "«Il credito l'ho fatto una volta. Una. A un drago.»"}, "sb_bye1": {"t": "«Tornate vivi. Non per voi: ho ancora i vostri conti da chiudere.»"}, "sb_bye2": {"t": "«Andate pure. Io aspetto qui il prossimo disastro. Arriva sempre.»"}, "r_avanza": {"t": "Il marciume avanza. Un'altra zona della Selva diventa nera."}, "z_lunargento": {"t": "Lunargento. Case sospese tra alberi d'argento, ponti di corda che si perdono tra le fronde. Gli elfi vi osservano dall'alto, in silenzio, e nessuno scende a salutarvi. Poi una figura avanza su un ramo: è Eilith, l'Anziana.\n\n«Gli umani portano fuoco e domande. Noi non amiamo né l'uno né le altre. Convincetemi che meritate la via sicura.»\n\nServe una prova di Fascino."}, "eilith_si": {"t": "Eilith abbassa lo sguardo.\n\n«I primi anelli della catena… li forgiammo noi. E qualcuno sapeva dove erano più fragili.»\n\nNon dice altro. Ma gli elfi vi mostrano i sentieri della Selva, e vi lasciano una pozione."}, "eilith_no": {"t": "Eilith vi volta le spalle senza una parola, e gli elfi spariscono tra i rami. Senza guida, la compagnia vaga tra gli alberi. E il tempo, nella Selva, è la cosa più preziosa che avete."}, "z_palude": {"t": "La Palude delle Radici. Acqua nera e ferma, che non riflette niente. Le radici affiorano come dita, e si muovono quando non le guardate. Qualcosa, sotto la superficie, vi ha già sentiti."}, "z_sottobosco": {"t": "Il Sottobosco degli Gnomi. Gallerie scavate tra radici enormi, ingranaggi, lanterne con dentro lucciole addormentate. Qualcuno ci vive, o ci viveva. Tra i tunnel si muove una sagoma di foglie secche."}, "tibbo": {"t": "Da una porticina tra le radici esce uno gnomo con una lente sull'occhio: Tibbo Brunopiede. Srotola un progetto bruciacchiato: la catena di Nhazgor, anello per anello.\n\n«Guardate qui. Questo è stato limato dall'interno. Qualcuno sapeva esattamente dove colpire.»\n\nAccanto all'anello limato, qualcuno ha inciso una piuma bruciata."}, "z_cerchio": {"t": "Il Cerchio di Pietre. Sette menhir alti come torri, ognuno inciso con il simbolo di un dio. Mentre passate, ognuno di voi sente vibrare la pietra del proprio dio. Ma tra le pietre, dei lupi marci hanno fatto la loro tana."}, "pietre": {"t": "Liberato il Cerchio, ognuno di voi posa la mano sulla pietra del proprio dio. Una forza antica vi attraversa: il vostro prossimo tiro avrà un bonus."}, "z_sylsant": {"t": "Il Santuario di Sylvara. Il tempio della dea è avvelenato: i rampicanti sono neri, l'acqua sacra è torbida. Qui le radici del Primo Albero affiorano, e con loro la fame. Dall'altare si alza uno spirito avvizzito."}, "purifica": {"t": "Il santuario è libero, ma non è guarito. Se restate qui per tre giri, potrete purificarlo e fermare il marciume per un po'. Ma il santuario si difenderà: altri spiriti emergeranno dalle radici."}, "sylvara": {"t": "I rampicanti tornano verdi. Una voce lontana, come vento tra le foglie: «Grazie, figli miei.» Il marciume si ferma per due giri."}, "z_liane": {"t": "Il Ponte di Liane. Corde e assi sospese sopra una gola senza fondo, che scricchiolano a ogni passo. Chi guida la compagnia deve superare una prova di Agilità: se fallisce nessuno cade, ma perdete tempo prezioso."}, "z_funghi": {"t": "La Radura dei Funghi. Funghi alti come torri e spore che brillano nell'aria come lucciole. È bellissimo, ed è velenoso. Attenzione al fungo più grosso: se lo abbattete, esplode."}, "cervo_n": {"t": "Il Cuore della Selva. Davanti al Primo Albero vi aspetta il cervo bianco di Sylvara. Metà del suo corpo è ancora luce. L'altra metà è marciume.\n\nÈ Albecorno, il guardiano del Seme. Ha cercato di fermare la fame mangiando le radici nere, e la fame ha mangiato lui. Dopo i vostri turni potrà colpire ancora, e a metà della sua vita il Primo Albero si sveglierà per difenderlo."}, "cervo_f": {"t": "Il marciume ha divorato la Selva fino al Limitare. Tra gli alberi neri avanza il cervo bianco di Sylvara, ormai per metà radice e per metà fame. Vi ha trovati, ed è al massimo della sua forza."}, "fase2": {"t": "Il terreno si apre. Le radici strangolanti emergono a difendere il Cervo, che però vacilla: la sua corazza di corteccia si incrina."}, "scelta": {"t": "Le radici avvizziscono. Il cervo cade in ginocchio e vi guarda, con un occhio bianco e uno nero.\n\nPotete finirlo e prendere il Seme. Oppure provare a strappare il marciume dal suo corpo: servono tre successi di Ingegno o Fascino prima di tre fallimenti, e a ogni fallimento il Cervo colpirà ancora.\n\nLa scelta è vostra."}, "fin_pura": {"t": "Il cervo si rialza bianco e leggero, vi guarda un'ultima volta e svanisce tra gli alberi. Il Seme si stacca dal tronco e vi cade in mano: è verde, caldo, vivo."}, "fin_fallita": {"t": "Il cervo si spegne tra le vostre mani. Il Seme si stacca dal tronco: è grigio e freddo. Sylvara tace."}, "fin_uccisa": {"t": "Il colpo cade. Il cervo non si rialza. Il Seme si stacca dal tronco: è grigio e freddo. Sylvara tace."}, "end2_verde": {"t": "Nella Selva torna il canto degli uccelli, e per la prima volta da molto tempo la compagnia sente di poter vincere.\n\nMa al Limitare, la lanterna di Seraphel brilla più debole di prima. E quando prende il Seme tra le mani, le sue dita tremano ancora.\n\nLa prima Reliquia è vostra. Ne restano sei. E la Vena, ora, vi porta verso il mare."}, "end2_grigio": {"t": "La compagnia torna al Limitare con la prima Reliquia e un peso in più. Seraphel prende il Seme senza una parola. Le sue mani tremano.\n\nLa prima Reliquia è vostra. Ne restano sei. E la Vena, ora, vi porta verso il mare."}, "selva_persa": {"t": "Le radici si chiudono sopra la compagnia. Da qualche parte, lontano, Nhazgor ride."}, "rec_intro": {"t": "Nella puntata precedente…"}, "rec_c1_mid": {"t": "Crocevento brucia. I Divorati sono ovunque, e la brace della lanterna si consuma. Il vostro obiettivo è sempre lo stesso: raggiungere il Tempio del Braciere."}, "rec_c1_salvi": {"t": "A Crocevento avete salvato i profughi del Ponte Vecchio, e la città non ha dimenticato i vostri volti."}, "rec_c1_persi": {"t": "A Crocevento non siete riusciti a salvare i profughi del Ponte Vecchio. Le loro grida vi seguono ancora."}, "rec_c1_fine": {"t": "Vorgath, il Primo Araldo, ha divorato il Braciere Eterno, e solo la lanterna di Seraphel lo ha messo in fuga. Lei vi ha rivelato il segreto delle sette Reliquie, e la compagnia ha giurato di ritrovarle."}, "rec_c2_inizio": {"t": "Poi siete entrati nella Selva Antica, dove il marciume sale dalle radici del Primo Albero e avanza verso di voi."}, "rec_c2_elfi": {"t": "A Lunargento, Eilith vi ha mostrato i sentieri della Selva, e ha ammesso che i primi anelli della catena furono forgiati dagli elfi."}, "rec_c2_gnomi": {"t": "Nel sottobosco, Tibbo Brunopiede vi ha mostrato un anello della catena limato dall'interno, segnato da una piuma bruciata."}, "rec_c2_santuario": {"t": "Avete purificato il santuario di Sylvara, e per un po' la Selva ha ripreso a respirare."}, "rec_c2_verde": {"t": "Nel Cuore della Selva avete liberato Albecorno dal marciume, e il Seme del Primo Albero è vostro: verde, vivo."}, "rec_c2_grigio": {"t": "Nel Cuore della Selva il Cervo Marcio è caduto, e il Seme del Primo Albero è vostro. Ma è grigio, e Sylvara tace."}, "rec_ripresa": {"t": "Ora riprendiamo da dove ci eravamo fermati. Che i dadi vi siano favorevoli."}, "i23_verde": {"t": "Il Seme del Primo Albero riposa nella bisaccia della compagnia, avvolto in un panno di Lunargento. Di notte, a volte, manda una luce tenue, come un respiro."}, "i23_grigio": {"t": "Il Seme del Primo Albero riposa nella bisaccia della compagnia, avvolto in un panno di Lunargento. È freddo, e pesa più di quanto dovrebbe."}, "i23": {"t": "Seraphel vi aspettava al Limitare, come aveva promesso. Ha guardato il Seme a lungo, senza toccarlo. Poi ha indicato l'ovest. «La prossima è di Kaoth. E Kaoth non ama essere trovato.»\n\nPer tre giorni avete seguito la Vena verso il mare. Il fiume, che a Crocevento si era fermato, qui corre all'indietro: risale verso le colline, carico di alghe e di sale.\n\nAl quarto giorno, la costa. Un arcipelago di isole basse, nere di scogli, che all'alba non sono dove erano al tramonto. E sopra il mare, lontano, un vortice che gira al contrario del vento.\n\nSulla spiaggia, accanto a un fuoco, c'è un carretto che conoscete. Con un'insegna nuova."}, "c3_collane": {"t": "Sull'insegna, dipinto male, c'è scritto: Sbrindello e Nessun Socio, commerci di terra e, da lunedì, di mare.\n\n«Voi. Proprio voi. Avete liberato la Selva e io, per la prima volta, ho fatto un affare che non mi ha rovinato. Mi viene da piangere. Non lo farò: costa.»\n\nSbrindello ha comprato quaranta Collane del Respiro: fili di corallo con una scaglia lucente, che fanno respirare sott'acqua. Contava di rivenderle ai turisti. Non ci sono turisti. Non ci sono mai stati.\n\n«Per ringraziarvi, ecco: una collana a testa. Regalata. Non guardatemi così, ho detto regalata. Se ne avanzano, sono in vendita.»"}, "c3_perla": {"t": "Le collane gliele ha vendute Madre Perla, una vecchia acquatica con la pelle che luccica come l'interno di una conchiglia.\n\n«Le scaglie sono di Vasthor, il guardiano del mare. Le perde quando muta, una volta ogni cent'anni. Quest'anno le ha perse tutte insieme. Come una bestia malata.»"}, "c3_coppa": {"t": "Madre Perla guarda Sbrindello bere acqua di mare dalla sua tazza di stagno, senza una smorfia. La assaggia. È dolce. Lo fissa a lungo, poi si volta verso di voi e dice soltanto: «Tenetevelo vicino, quel goblin.»"}, "c3_seraphel": {"t": "Seraphel si siede accanto al fuoco del carretto e dice che il mare non fa per lei. Quando qualcuno nomina il faro che si vede lontano, a nord, risponde troppo in fretta: «È spento da anni. Non c'è niente, lassù.»"}, "c3_regole": {"t": "Ascoltate bene, perché qui il mare cambia le regole.\n\nOgni tre giri la marea cambia. Con l'alta marea le zone basse finiscono sott'acqua: per entrarci serve una prova di Forza o di Agilità, e chi fallisce arriva senza fiato. Thalassar, la città sommersa, è sempre sott'acqua. Le bombe, sotto le onde, non esplodono. E gli Acquatici, laggiù, sono a casa.\n\nA ogni alta marea due isole inesplorate cambiano posto. E a ogni cambio di marea il Gorgo gira più forte: quando arriva a cinque, il Leviatano emerge da solo, dovunque voi siate.\n\nIl vostro obiettivo è l'Occhio del Gorgo. Ma su ogni isola c'è qualcosa che uno dei vostri dei vorrebbe che trovaste."}, "sb3_hello": {"t": "«Città sommerse, mostri marini, pirati. Mi mancava solo l'acqua salata nelle scarpe. Ah, no, ce l'ho.»"}, "sb_collana1": {"t": "«Una collana! Vedete? Lo sapevo che c'era mercato. Lo sapevo.»"}, "z_portorelitto": {"t": "Il Porto del Relitto. Un villaggio di pescatori costruito sopra le carcasse delle navi, con le finestre che guardano il fondo del mare. A ogni alta marea l'acqua entra in casa, e nessuno ci fa più caso."}, "z_relitto": {"t": "Il Relitto della Corte. Una galea giace su un fianco, coperta di alghe. Sulla poppa le insegne della Bilancia sono ancora leggibili. Qualcosa, nella stiva, si muove con un rumore di guscio che striscia."}, "z_nido": {"t": "Il Nido dei Predoni. Un'isola-fortezza fatta di scafi legati con le catene. Sul pontile, casse di pane nero, accatastate con cura. Troppe, per una ciurma sola."}, "z_giardino": {"t": "Il Giardino di Corallo Nero. Un tempo era sacro a Kaoth e a Sylvara insieme: la vita che nasce dal mare. Ora il corallo è nero, e tra i rami nuotano lampi azzurri."}, "z_faro": {"t": "Il Faro Spento. Sull'isola più a nord, una torre dei Custodi della Fiamma con la lanterna buia e la scala mangiata dal sale. Qualcuno, quassù, non se n'è mai andato del tutto."}, "z_scogliera": {"t": "La Scogliera delle Sirene. Rocce nere che cantano quando il vento gira. Ma oggi il vento è fermo, e il canto continua lo stesso."}, "thessa": {"t": "Tra le reti stese ad asciugare, una giovane acquatica disegna carte su pelli di pesce. Ne ha decine, e nessuna è uguale all'altra.\n\n«Le isole non stanno ferme, quindi io non sto ferma. Ogni notte una carta nuova. Mi chiamo Thessa. E no, non vi porto a Thalassar gratis: convincetemi che sapete cosa state facendo.»"}, "thessa_si": {"t": "Thessa arrotola le carte e se le infila nella cintura. «Va bene. Vi porto io. Ogni luna nuova i Predoni escono verso il Gorgo carichi di casse, e non so cosa ci sia dentro. Vorrei saperlo anch'io.»\n\nPoi, a voce più bassa: «A Thalassar troverete mia madre. Non credete a tutto quello che dice. Solo a quasi tutto.»"}, "thessa_no": {"t": "«Tornate quando saprete dove andare. Io lo so già, ed è già abbastanza difficile.»"}, "faro_diario": {"t": "Nella stanza del guardiano, sotto un velo di sale, c'è un diario. L'ultima pagina scritta dice:\n\n«Terza notte della Carestia Grigia. È arrivata una Custode giovane, poco più di una ragazza. Non ha voluto dire il suo nome, solo l'iniziale: S. Aveva gli occhi di chi ha seppellito troppi bambini. Ripartita all'alba verso il vulcano, con una lima di ossidiana nella bisaccia. Non le ho chiesto a cosa servisse. Me ne pento.»"}, "faro_luce": {"t": "La brace di Seraphel tocca lo stoppino, e il faro dei Custodi si accende per la prima volta in sessant'anni. La luce corre sul mare, e le isole del bordo, una dopo l'altra, smettono di muoversi. Da qualche parte, Pyrath si ricorda di avere ancora un fuoco."}, "capitana_dadi": {"t": "La Capitana Velanera vi aspetta seduta su una cassa di pane, con un bicchiere di dadi in mano. Al collo porta una moneta d'oro con due facce uguali.\n\n«Siete venuti a prendervi il mio pane? Prima giochiamo. Se vincete, la moneta è vostra. Se perdete, me la tengo. E poi ci ammazziamo lo stesso, come si fa tra gente seria.»"}, "capitana_resa": {"t": "La Capitana è in ginocchio sul pontile, la sciabola nell'acqua. Non chiede pietà. Racconta.\n\nUn anno fa il Culto della Bocca Aperta le ha offerto pane per tutta la ciurma, in cambio di un favore: ogni luna nuova, gettare nel Gorgo casse di quel pane. Lei non ha chiesto perché. La ciurma mangiava.\n\n«Il Leviatano lo mangia. E il pane fa con lui quello che fa con noi. Adesso lo sapete. Fatene quello che volete.»"}, "sirene": {"t": "Dalle rocce sale un canto senza parole, poi con le parole. Le sirene erano Acquatiche uscite dalle crepe della cupola di Thalassar e rimaste fuori troppo a lungo. Ora cantano per non dimenticare.\n\nCantano di una rosa nera trascinata dalla corrente verso le nebbie del nord. Chi ascolta troppo a lungo rischia di non volersene più andare."}, "coro_maral": {"t": "Sotto le onde, Thalassar è una conchiglia di corallo bianco sotto una cupola d'aria grande come una valle. Le crepe si allargano a ogni marea, e gli Acquatici le richiudono con le mani.\n\nVi riceve Maral, la Voce del Coro delle Maree. «Il mondo non sta morendo per troppa fame. Sta morendo per troppe regole. Varenna ha legato le mani a tutti gli dei per legarle a uno solo. In fondo al mare, nel relitto della Corte, c'è uno dei suoi Sigilli. Spezzatelo, e il mare tornerà a obbedire a chi lo ha creato.»"}, "coro_thessa": {"t": "Maral vede Thessa, e per un istante la sua voce cambia. Thessa non abbassa gli occhi. «Il caos non sceglie da che parte stare, madre.»"}, "coro_oruun": {"t": "Poi il Coro canta il Canto dei Nomi Annegati: l'elenco di tutti quelli che il mare ha preso dall'Era della Forgia. A metà del canto c'è un vuoto, una sillaba che nessuno riesce a cantare. Chi ha fede in Oruun la sente lo stesso: è il secondo frammento del nome cancellato.\n\nIl canto vi lascia più leggeri, e le ferite si chiudono."}, "coro_guardie": {"t": "Dalle onde salgono le guardie del Coro, lance di corallo e occhi d'argento. Non sono qui per voi. Sono qui per il loro mare."}, "sigillo": {"t": "Nella stiva, in una gabbia di bronzo, c'è un disco d'argento con una mano destra incisa: la mano che Varenna diede per sigillare il Patto.\n\nMaral vuole che lo spezziate, e non mente: il mare si calmerebbe davvero. Ma non dice tutto. Ogni Sigillo spezzato allenta il Patto per tutti gli dei, anche per quello che nessuno nomina.\n\nPotete spezzarlo, portarlo via intatto o lasciarlo dov'è. Decidete insieme."}, "sig_spezza": {"t": "Il disco si spacca con un suono di campana. Per un istante il mare si ferma. Poi, da tutto l'arcipelago, sale una risata: è Kaoth, e ride come un'onda che si rompe. Il Gorgo rallenta.\n\nChi ha fede in Varenna sente qualcosa chiudersi, come una porta. E molto lontano, sotto le radici del mondo, qualcuno respira meglio."}, "sig_prendi": {"t": "Avvolgete il Sigillo in un panno e lo portate via. È pesante come una promessa. A Thalassar lo sapranno presto, e Maral non lo dimenticherà."}, "sig_lascia": {"t": "Richiudete la gabbia di bronzo. Il Sigillo resta dov'è stato per trent'anni. Nessuno vince, nessuno perde. Per ora."}, "purifica3": {"t": "Il giardino è libero, ma il corallo è ancora nero. Restate qui: le Anguille torneranno al loro nido, e dovrete resistere due giri perché il mare se ne ricordi."}, "giardino_puro": {"t": "Il corallo torna bianco, ramo dopo ramo, come se qualcuno accendesse delle candele sott'acqua. Sylvara e Kaoth, per una volta, sono d'accordo. Per una marea, le zone basse resteranno asciutte."}, "marea_alta": {"t": "La marea sale in pochi respiri, a un'ora che non ha senso. Le zone basse spariscono sotto l'acqua, e due isole, laggiù, scivolano via dal loro posto."}, "marea_bassa": {"t": "Il mare si ritira come se qualcuno lo bevesse. Le zone basse riemergono, lucide e piene di cose che prima non c'erano."}, "gorgo_sale": {"t": "Il Gorgo ora si sente anche da qui: un rombo sotto i piedi, continuo. Ancora un cambio di marea, e il Leviatano non aspetterà più che siate voi ad andare da lui."}, "vasthor_n": {"t": "All'Occhio del Gorgo il mare gira su sé stesso e scende. Poi si alza come un muro. Prima le scaglie, poi gli occhi, grandi come vele, color latte.\n\nÈ Vasthor, il guardiano della Goccia. Non è un mostro: è un guardiano che ha mangiato quello che gli è stato dato, finché quello che gli è stato dato ha mangiato lui."}, "vasthor_f": {"t": "Il Gorgo arriva a voi. Il mare si apre sotto i vostri piedi e Vasthor emerge dove siete, gli occhi color latte, la bocca piena di pane nero. Le zone basse non torneranno più asciutte.\n\nNon è un mostro: è un guardiano che ha mangiato quello che gli è stato dato, finché quello che gli è stato dato ha mangiato lui."}, "vasthor_fase2": {"t": "Vasthor si immerge, e il mare sotto di voi comincia a girare. Il Gorgo si apre: a ogni giro qualcuno verrà trascinato giù, e dovrà risalire con le proprie braccia."}, "vasthor_morte": {"t": "Il Leviatano cade. Per un istante i suoi occhi tornano azzurri, e vi guarda come si guarda qualcuno che arriva tardi, ma arriva.\n\nPer mille anni ha custodito il mare. Per un anno solo, ha avuto fame. Il mare se ne ricorderà nel modo giusto."}, "goccia": {"t": "Mentre il corpo affonda, dal suo petto sale una perla d'acqua che non si mescola al mare: la Goccia Primordiale. Il gorgo si sta chiudendo, e la trascina giù con sé. Afferratela, adesso."}, "goccia_limpida": {"t": "La Goccia vi resta in mano, limpida come il primo mattino del mondo. E Kaoth parla, per la prima volta, con una voce che sembra un'onda: «Libertà non è assenza di regole. È poter scegliere quali.»"}, "goccia_torbida": {"t": "La Goccia è vostra, ma è torbida, nera come il pane del Culto. Da qualche parte, sotto le radici del mondo, la catena perde un anello."}, "mare_perso": {"t": "Il mare si chiude sopra di voi. L'ultima cosa che vedete è la luce, lontana, che si allontana. Il Gorgo continua a girare."}, "end3_spiaggia": {"t": "La marea torna normale per la prima volta da un anno. Le isole si fermano. Sbrindello ha venduto tre collane a un gruppo di pescatori, e lo racconta come una vittoria militare.\n\nSeraphel guarda il mare, con la Goccia riflessa negli occhi."}, "end3_diario": {"t": "Poi chiede di vedere il diario del faro. Legge una sola pagina, quella dell'iniziale S., e lo restituisce senza commentare. Le tremano le mani, come al Limitare. A bassa voce dice: «Ad Aurea vi racconterò una cosa. Non qui.»"}, "end3_nave": {"t": "All'alba, all'orizzonte, compare una galea con le insegne della Bilancia. La Corte ha visto il mare calmarsi, e sa che qualcuno è sceso al relitto."}, "end3_spezza": {"t": "Un inquisitore scende sulla spiaggia e dichiara la compagnia in arresto per sacrilegio contro il Patto. Entrerete ad Aurea in catene, o in fuga."}, "end3_prendi": {"t": "L'inquisitore vede il Sigillo, e si inginocchia nella sabbia. Vi offre un passaggio. Entrerete ad Aurea da ospiti della Corte."}, "end3_lascia": {"t": "L'inquisitore interroga tutti, uno per uno, e non crede a nessuno. Entrerete ad Aurea, ma sorvegliati."}, "end3_lanterna": {"t": "Quando vede le insegne della Bilancia, Seraphel spegne la lanterna. È la prima volta che la vedete al buio.\n\nLa seconda Reliquia è vostra. Ne restano cinque. E la strada, adesso, porta ad Aurea."}, "rec_c3_inizio": {"t": "Seguendo la Vena siete arrivati al mare dell'ovest, dove le maree vanno al contrario. Sbrindello vi ha regalato le Collane del Respiro, e Seraphel è rimasta sulla spiaggia."}, "rec_c3_thessa": {"t": "Al Porto del Relitto, Thessa la cartografa ha deciso di guidarvi tra le isole che si spostano."}, "rec_c3_faro": {"t": "Nel faro spento avete trovato il diario di un guardiano, e una Custode con l'iniziale S."}, "rec_c3_nido": {"t": "Al Nido dei Predoni la Capitana Velanera si è arresa, e ha confessato il patto del pane con il Culto."}, "rec_c3_spezza": {"t": "Nel relitto della Corte avete spezzato il Sigillo del Giuramento, e Kaoth ha riso."}, "rec_c3_prendi": {"t": "Nel relitto della Corte avete preso il Sigillo del Giuramento, intatto."}, "rec_c3_lascia": {"t": "Nel relitto della Corte avete lasciato il Sigillo del Giuramento dov'era."}, "rec_c3_limpida": {"t": "Avete fermato la fame di Vasthor, e la Goccia Primordiale è vostra, limpida."}, "rec_c3_torbida": {"t": "Avete fermato la fame di Vasthor, ma la Goccia Primordiale è torbida."}, "eco_cittadini": {"t": "Tra i tronchi marci compare una figura che conoscete: Nella, una dei profughi di Melodoro che avete tirato fuori dalle fiamme sul Ponte Vecchio. Vi ha seguiti fin dentro la Selva, con un cesto sotto il braccio.\n\n«Pane non ne ho più. Ma queste le ho prese al Mercato dei Venti. Pagate, quasi tutte.» Nel cesto ci sono due pozioni. Poi scappa, prima che il Cervo si accorga di lei."}, "eco_albecorno": {"t": "Sulla schiuma, dove nessun cervo dovrebbe poter correre, corre Albecorno. Bianco, intero, guarito dalle vostre mani nella Selva. I suoi zoccoli lasciano luce verde sull'acqua.\n\nAbbassa le corna verso di voi, e quella luce vi scivola sulle ferite. Poi si volta verso il Leviatano. La Selva non dimentica chi l'ha salvata."}, "eco_grigio": {"t": "Nella bisaccia, il Seme grigio pulsa. Una volta. Due. Vasthor lo sente, perché la fame riconosce la fame.\n\nLe sue scaglie si gonfiano di marciume, e il mare intorno a voi diventa del colore della cenere. Quello che avete lasciato morire nella Selva, adesso, nutre il vostro nemico."}, "eco_elfi": {"t": "All'orizzonte compare una vela color della luna. Gli elfi di Lunargento non dimenticano un debito, e non dimenticano un'alleanza.\n\nUna pioggia di frecce d'argento attraversa la nebbia e si pianta nei tentacoli del Leviatano. Da lontano, la voce di Eilith: «La Selva salda i suoi conti. Ora saldate voi i vostri.»"}, "accusa_intro": {"t": "La prima notte sulla spiaggia nessuno dorme davvero. Il fuoco scoppietta, il mare respira al contrario, e ognuno guarda gli altri un po' più a lungo del solito.\n\nPoi qualcuno lo dice ad alta voce. La brace che si spegneva troppo presto, il marciume sempre un passo avanti a voi: troppe coincidenze. Tra voi c'è qualcuno che ascolta un'altra voce.\n\nStanotte potete scegliere. Accusare qualcuno, davanti a tutti. Oppure lasciare che il sospetto dorma con voi."}, "accusa_giusta": {"t": "Il silenzio dura un respiro di troppo. Poi il fuoco si piega, come se qualcosa sotto la sabbia avesse ritirato la mano.\n\nAvete visto giusto. Il patto con il Re Affamato si spezza, e ogni suo dono svanisce. Ma un patto spezzato non è un cuore cambiato. Adesso, davanti a tutti, il traditore deve dire da che parte sta."}, "accusa_sbagliata": {"t": "L'accusato vi guarda, e nei suoi occhi non c'è paura. C'è qualcosa di peggio: delusione.\n\nAvete sbagliato. E da qualche parte, molto in basso, sotto le radici del mondo, qualcuno ride. Ogni sospetto ingiusto è un anello che si allenta. La Catena ha sentito il colpo."}, "quad_c2": {"t": "Crocevento. Carretto incendiato dai Divorati. Danni: totali. Rimborso: nessuno. Colpevoli: un gruppo di eroi, presenti per caso. Come sempre.\n\nAttivo: rivenduta la cenere del carretto come concime. Margine: modesto.\n\nVoce a parte. Coppa di peltro dello zio Grumo, ammaccata, invendibile. Si riempie da sola di brodo tiepido. Da far vedere a un prete. O a un cuoco."}, "quad_c3": {"t": "Selva Antica. Vendute pozioni a voi, bombe a voi, una bomba restituita. Accesa. Per la prima volta in vita mia il conto è in attivo.\n\nInvestito tutto in quaranta Collane del Respiro. Turisti avvistati sulla costa: zero.\n\nVoce a parte. La coppa dello zio continua. Ieri era minestrone. Ho smesso di lavarla: si lava da sola. Questo non lo dico a nessuno."}, "tut_iniz": {"t": "Prima di ogni scontro si tira l'iniziativa. Ognuno di voi tira un d20 e ci aggiunge la propria Agilità: chi fa di più agisce per primo. Anche i nemici tirano.\n\nL'ordine compare in alto, e resta lo stesso per tutto il giro."}, "tut_azioni": {"t": "Tocca a voi. Ogni eroe ha due azioni per turno.\n\nAttaccare costa un'azione: si tira un d20 più la caratteristica della propria classe, e se si raggiunge la Classe Armatura del nemico lo si colpisce, tirando un d6 per i danni. L'abilità di classe si usa una volta per scontro, la benedizione del vostro dio una volta per capitolo. E se un compagno cade, l'azione Aiuta lo rimette in piedi."}, "tut_nemici": {"t": "Ora tocca ai nemici. Di solito colpiscono chi è più debole.\n\nSe il loro tiro raggiunge la vostra Classe Armatura, perdete Vita. A zero si va a terra, ma non si muore: un compagno può rialzarvi con Aiuta, o con una pozione."}, "tut_fine": {"t": "Zona liberata. Ora potete muovervi verso le zone vicine, e cercare quello che i Divorati hanno lasciato.\n\nMa tenete d'occhio la brace della lanterna, in alto: cala con il passare dei giri, e quando si spegne la fame vi trova. La vostra meta è il Tempio del Braciere."}, "i34": {"t": "La Goccia è al sicuro, e la marea è tornata a obbedire alla luna. Ma la galea della Corte non se ne va.\n\nPer cinque giorni risalite la costa verso sud, finché le colline diventano d'oro. Prima i campi, poi le strade lastricate, poi le mura. Aurea, la Città della Bilancia, dove ogni anima ha un peso e ogni peso ha un prezzo.\n\nSopra la porta c'è una bilancia di pietra alta come una torre. I suoi piatti sono fermi. Da un anno, dicono, nessuno li ha più visti muoversi."}, "i34_prendi": {"t": "L'inquisitore Corvo Lanzeri vi ha offerto un passaggio sulla galea. Il Sigillo del Giuramento viaggia avvolto in un panno bianco, sul tavolo del capitano. Per tutto il viaggio Lanzeri non lo ha perso di vista, e nemmeno voi."}, "i34_lascia": {"t": "Avete raggiunto Aurea a piedi. L'inquisitore Corvo Lanzeri vi ha seguiti per tutta la costa, sempre a cento passi, sempre con il suo cappello piumato. Non vi ha arrestati. Non vi ha nemmeno salutati. Prende appunti."}, "i34_spezza": {"t": "Siete entrati ad Aurea in catene. Sacrilegio contro il Patto, ha detto l'inquisitore Corvo Lanzeri, leggendo la sentenza prima ancora del processo. Vi hanno tolto le armi alla porta e vi hanno chiusi nelle Prigioni del Peso, sotto la città.\n\nNella cella accanto, qualcuno si lamenta del trattamento. È Sbrindello. Lo hanno arrestato per complicità. Dice che è la prima volta che qualcuno lo considera così importante."}, "c4_seraphel": {"t": "Alla porta, le guardie leggono un nome dal Registro della Corte. Non è il vostro. È quello di Seraphel.\n\nLei non oppone resistenza. Consegna la lanterna, porge i polsi, e prima che la portino via vi guarda un'ultima volta. «Ve l'avevo promesso. Ad Aurea vi racconterò una cosa. Venite a sentirla.»"}, "c4_regole": {"t": "Ascoltate bene, perché ad Aurea tutto si pesa.\n\nOgni tre giri suonano le campane del Verdetto. Al quinto rintocco comincia il processo di Seraphel, ovunque voi siate. Le guardie vi porteranno al Palazzo del Giudizio.\n\nOgni cosa che fate in città finisce su una bilancia: le Colpe da una parte, i Meriti dall'altra. Combattere le guardie della Bilancia è una colpa. Aiutare chi ha fame è un merito. Al processo, quella bilancia peserà più di qualunque spada.\n\nE la città è piena di persone che vi chiederanno qualcosa. Ascoltatele: il diario delle missioni ricorda tutto."}, "c4_saggiatore": {"t": "Alla dogana, un Saggiatore della Corte si ferma davanti al carretto di Sbrindello. Non guarda le pozioni. Guarda la vecchia coppa di peltro appesa a un chiodo. La pesa con gli occhi, a lungo. Poi offre il prezzo di una casa.\n\n«Non è in vendita.»\n\nSbrindello si copre la bocca con le mani, come se le parole fossero scappate da sole. Il Saggiatore sorride, saluta, e se ne va. Non sembra un uomo che rinuncia.\n\n«Non so perché l'ho detto. Non l'ho mai detto. Mi sento male.»"}, "c4_dazio": {"t": "«Trenta per cento. Trenta! Sulle pozioni, sulle bombe, sul carretto, perfino su di me: ho dovuto dichiararmi come merce.»\n\nIl doganiere non alza gli occhi dal registro. Forse un eroe con la parlantina giusta potrebbe convincerlo a chiudere un occhio. O forse basterebbe pagare."}, "dazio_ok": {"t": "Il doganiere chiude il registro con un sospiro. Sbrindello vi guarda come si guarda un miracolo. «Per voi, pozioni a otto monete. Non ditelo a nessuno. Soprattutto non ditelo a me.»"}, "quad_c4": {"t": "Aurea. Dazio d'ingresso: trenta per cento su tutto, anche sulla pazienza. Un Saggiatore della Corte ha offerto per la coppa dello zio il prezzo di una casa. Ho detto di no.\n\nVoce a parte. Stamattina la coppa era piena d'acqua di fonte. Qui l'acqua si paga.\n\nNon l'ho venduta. Non mi riconosco più."}, "z_sabbiaoro": {"t": "Sabbiaoro, il bazar. Tende di seta, dadi che rotolano, monete che cambiano mano più in fretta dei proprietari. Qui tutto è in vendita, perfino la fortuna. E tra la folla, qualcuno vi ha già notati."}, "z_banco": {"t": "Il Gran Banco. Colonne di marmo, montagne d'oro, e in fondo alla sala casse di pane che brilla come il sole al tramonto. Il pane dorato del Culto. Dietro le casse, qualcosa di enorme conta le monete con le dita sporche d'oro."}, "z_archivio": {"t": "L'Archivio del Registro. Scaffali che salgono fino al buio, e al centro un libro aperto grande come una porta. Qui c'è scritto il nome di ogni anima che sia mai entrata ad Aurea, e il suo peso."}, "z_piatti": {"t": "Il Quartiere dei Piatti Vuoti. Tende rattoppate, ciotole rovesciate, bambini con gli occhi troppo grandi. Sono i profughi di Melodoro, dentro le mura di Aurea e fuori dalla sua legge. Di notte, tra le tende, si muove qualcosa che ha più fame di loro."}, "z_fonderie": {"t": "Le Fonderie. Il grande crogiolo della città è freddo. I fonditori battono l'oro a freddo, a mani nude, e nessuno ricorda l'ultima volta che il fuoco ha ruggito qui dentro. Da quando l'Ago si è fermato, dicono, anche il fuoco ha smesso di obbedire."}, "z_giardini": {"t": "I Giardini Pensili. Le terrazze dei giudici, sospese sopra la città, con fontane d'oro e rose d'oro. Tutte d'oro, tranne una. In un'aiuola in fondo, su un roseto dorato, qualcuno ha innestato una rosa nera."}, "z_prigioni": {"t": "Le Prigioni del Peso. Sotto la città, celle chiuse da bilance di bronzo invece che da serrature: per aprirle bisogna pesare quanto chi è dentro. In fondo al corridoio, una luce che conoscete non c'è più. La lanterna di Seraphel è appesa al muro, spenta, tra le cose sequestrate."}, "z_palazzo": {"t": "Il Palazzo del Giudizio. Una sala grande come una cattedrale, e in fondo la statua di Varenna, bendata, con la bilancia in mano. Sotto la statua, sul seggio più alto, un vecchio con una toga rossa e oro vi sorride. Ha le briciole d'oro sul petto."}, "banco_scelta": {"t": "La sala è vostra. Le casse di pane dorato brillano nella penombra, e la cassaforte è aperta.\n\nPotete bruciare il pane, perché nessun altro lo mangi. Potete prendere l'oro, perché nessuno lo saprà. O quasi nessuno."}, "banco_ricevute": {"t": "Tra le carte del banchiere ci sono le ricevute del pane dorato. Centinaia. Ogni pagnotta pagata a peso d'oro, e ogni ricevuta firmata con lo stesso segno: una bocca aperta. Il Culto è arrivato fino al cuore della Corte."}, "archivio_registro": {"t": "Il libro è aperto alla pagina della Carestia Grigia. Sessant'anni fa. Una colonna di nomi di Melodoro, tutti segnati con la stessa parola: respinti. E sotto, scritto con un'altra mano, un nome solo: Seraphel Velocenere, Custode della Fiamma. Accanto al nome, un'accusa che nessuno ha mai processato."}, "archivio_frammento": {"t": "Più in alto, su una pagina antichissima, un nome è stato raschiato via con una lama d'oro. Ma la lama non ha tolto tutto. Resta una sillaba, incisa così a fondo che la pergamena la ricorda. È il terzo frammento del nome cancellato."}, "crogiolo": {"t": "Avvicinate la lanterna di Seraphel al crogiolo. La brace di Pyrath, l'ultima rimasta, salta nel metallo freddo come un gatto in un cesto.\n\nIl crogiolo ruggisce. I fonditori smettono di lavorare e restano a guardare il fuoco, con le lacrime agli occhi. Da qualche parte, in alto, nel Palazzo, qualcosa d'oro si incrina."}, "moneta_zarek": {"t": "Il mercante di Sabbiaoro ha perso una Moneta del Destino a dadi, anni fa, contro una capitana di pirati. Non ha mai smesso di pensarci. Ha la seconda appesa al collo, e un dado in mano.\n\n«Una partita. Se vinci, è tua. Se perdi, mi dai tutto quello che hai in tasca. Zarek guarda, e Zarek ride sempre.»"}, "celle_kaoth": {"t": "Le bilance delle celle si possono ingannare: basta un peso falso. Aprite una cella, poi un'altra, poi tutte. I prigionieri escono nel corridoio, increduli. Alcuni sono ladri. Altri hanno solo rubato del pane.\n\nKaoth ride, da qualche parte. Il caos non sceglie chi liberare."}, "nella_chiede": {"t": "Tra le tende, una figura che conoscete vi riconosce per prima. Nella, la profuga di Melodoro che avete salvato sul Ponte Vecchio.\n\n«Siete voi. Ve l'avevo detto che saremmo arrivati lontano. Siamo arrivati qui. Non è lontano abbastanza.»\n\nVi racconta che ogni notte uomini con le vesti d'oro portano pane ai profughi. Pane che non finisce mai. «Dicono che è un dono della Corte. Mia sorella l'ha mangiato. Adesso non dorme più. Ha sempre fame. Portatemene uno, di quei pani. Voglio vedere cosa c'è dentro, prima di decidere.»"}, "nella_fatta": {"t": "Nella spezza il pane dorato davanti a tutti. Dentro non c'è mollica: c'è una polvere nera, come cenere.\n\nPer un lungo momento nessuno parla. Poi, una per una, le famiglie di Melodoro gettano il pane del Culto nel fuoco.\n\n«Al processo verremo anche noi. Non abbiamo niente da dare. Ma abbiamo qualcosa da dire.»"}, "nella_ingorda": {"t": "Tra le tende, una figura vi aspetta. È Nella. Ha le vene d'oro sul viso, e in mano un pane che brilla.\n\nAvete tardato troppo. Ha fame, adesso, e la fame non riconosce nessuno."}, "lirio_chiede": {"t": "Accanto alla rosa nera c'è un giovane con un liuto e le mani sporche di terra. Lirio, poeta di corte.\n\n«Non guardatela troppo, la rosa. A loro non piace. L'ho portata da casa mia, a nord, dove le lanterne galleggiano sulle nebbie. Qui pensavano fosse una curiosità. Adesso pensano che io sappia troppe cose.»\n\nVuole andarsene da Aurea vivo. Se lo scortate fino alla Porta d'Oro, vi dirà dove cresce la Rosa Nera."}, "lirio_fatta": {"t": "Alla Porta d'Oro, Lirio respira come chi è uscito dall'acqua. Vi mette in mano una mappa disegnata su un foglio di spartito.\n\n«La Valle delle Lanterne. Lì la Rosa Nera cresce da sola, e Isthara canta ancora. Se ci andate, non fidatevi delle lanterne che si muovono contro il vento.»"}, "lanzeri_chiede": {"t": "Tra le bancarelle, un cappello piumato. Corvo Lanzeri vi stava aspettando.\n\n«Non sono qui per arrestarvi. Non ancora. Sono qui perché qualcuno ad Aurea mangia troppo, e io non ho prove. Voi entrate dove io non posso. Portatemi qualcosa di scritto. La legge vive di carta.»"}, "lanzeri_alleato": {"t": "Lanzeri sfoglia le ricevute una per una, senza fretta. Quando arriva alla firma, la bocca aperta, chiude gli occhi.\n\n«Ho servito la Corte per trent'anni. Credevo di servire la legge.» Si toglie il cappello. «Al processo testimonierò. E da adesso non vi seguo più. Vi accompagno.»"}, "coppa_furto": {"t": "La seconda campana suona, e nel buio della Porta d'Oro qualcuno si muove intorno al carretto. Gli uomini del Saggiatore sono venuti a prendersi la coppa."}, "coppa_rubata": {"t": "Quando tornate alla Porta d'Oro, Sbrindello è seduto per terra accanto al carretto. Non piange. È peggio: non dice niente. La coppa non c'è più. Sul chiodo vuoto, qualcuno ha lasciato una ricevuta del Gran Banco."}, "coppa_difesa": {"t": "I tagliaborse scappano nel buio. Sbrindello stringe la coppa al petto come un bambino. Alla luce della lanterna, per un attimo, la vedete: è piena di vino rosso, fino all'orlo. Un momento prima era vuota.\n\n«Non dite niente. Non chiedete niente. Io non so niente.»"}, "coppa_ritrovata": {"t": "Nella cassaforte del Gran Banco, tra lingotti e collane, c'è una vecchia coppa di peltro, ammaccata. Del tutto fuori posto. La riportate a Sbrindello, che la guarda come si guarda un figlio tornato dalla guerra."}, "campana": {"t": "Suonano le campane del Verdetto. Il processo si avvicina."}, "confessione": {"t": "Seraphel è seduta sul pavimento della cella, senza la sua lanterna. Per la prima volta sembra vecchia. Quando vi vede, non si alza.\n\n«Avevo diciassette anni. A Melodoro i bambini morivano con le mani sulla pancia, e ad Aurea i granai erano pieni. Sono salita al vulcano con una lima. Lui mi ha promesso che la loro fame sarebbe passata a lui. Ha mantenuto la promessa. È questo il peggio: ha mantenuto la promessa.»\n\n«Da quella notte la catena cede. Ogni anello che si rompe, l'ho rotto io. Adesso lo sapete.»"}, "processo_apre": {"t": "Il Palazzo è pieno. Giudici, banchieri, guardie, e in fondo alla sala, contro il muro, i poveri che nessuno ha invitato.\n\nSeraphel è in piedi davanti al seggio, con i polsi legati. Il Gran Giudice Aurelio si sporge in avanti, e la voce gli esce dolce come miele. «Sacrilegio contro il Patto. Confessa, Custode?»\n\n«Confesso.»\n\nAurelio sorride. «Allora la bilancia deciderà. Ma prima, la Corte ascolterà chi vuole parlare.» E guarda voi."}, "verdetto_assolta": {"t": "Le prove pesano. Il Registro, le testimonianze, le mani dei profughi alzate in fondo alla sala. Per la prima volta da un anno, i giudici della Corte non guardano Aurelio: guardano Seraphel.\n\nLa Corte la assolve. Non perché sia innocente. Perché sessant'anni di colpa sono già una pena."}, "verdetto_ko": {"t": "Avete parlato per lei. Ma ad Aurea le parole non bastano, se la bilancia pende dall'altra parte. Le vostre colpe pesano più dei vostri meriti, e la Corte lo vede.\n\nSeraphel viene condannata. Non dice niente. Vi guarda come se fosse lei a dovervi consolare."}, "verdetto_condanna": {"t": "Avete scelto la legge. Seraphel ascolta la sentenza senza una parola, e quando le guardie le prendono le braccia annuisce, come chi aspetta quel momento da sessant'anni.\n\nVarenna, dicono, è bendata perché non le importi chi ha davanti. Oggi, per un istante, sembra che la statua abbia chinato la testa."}, "verdetto_posto": {"t": "Un passo avanti. Una voce sola, nella sala piena. Qualcuno della compagnia si offre di essere pesato al posto di Seraphel.\n\nAurelio ride, una risata lunga, affamata. «Una vita per una vita. La Corte accetta.» Seraphel vi guarda, e per la prima volta da quando la conoscete, piange."}, "ago_indica": {"t": "Aurelio si alza. «Che sia l'Ago a pesare!» E tutta la sala si volta verso la grande bilancia di Varenna.\n\nPer la prima volta in un anno, l'Ago si muove. Trema, gira, e si ferma. Non indica Seraphel. Indica lui.\n\nIl Gran Giudice guarda l'Ago a lungo. Poi apre la bocca, e la bocca continua ad aprirsi, troppo, come quella di un Divorato."}, "aurelio_n": {"t": "Aurelio strappa l'Ago dalla bilancia e lo ingoia. L'oro gli sale dalla gola alla pelle, e la statua di Varenna alle sue spalle si piega su di lui come un'armatura.\n\nÈ Aurelio, il Giudice Ingordo. Non ha mai rubato una moneta. Ha solo pensato, ogni giorno, di meritarne di più."}, "aurelio_f": {"t": "Il quinto rintocco. Le guardie vi trascinano nel Palazzo, e il processo comincia senza aspettarvi."}, "aurelio_fase2": {"t": "Aurelio vacilla, e l'oro della statua gli cola dalle spalle. Ma non cade. Si guarda intorno, e i suoi occhi si fermano sulle vostre borse.\n\n«Ancora. Ne voglio ancora.» Da adesso divora le monete di chi gli sta vicino, e ogni moneta lo rimette in piedi."}, "aurelio_morte": {"t": "Il Giudice Ingordo crolla. L'oro gli scivola via di dosso come acqua, e quello che resta è un vecchio nudo e magro, magro come i profughi in fondo alla sua aula. Piange.\n\nL'Ago rotola sul pavimento di marmo. È piegato, ma si muove ancora."}, "ago_voto": {"t": "L'Ago è piegato dalla fame di Aurelio, e solo una mano può raddrizzarlo. La compagnia deve scegliere a chi affidarlo.\n\nIl voto è segreto. Nessuno saprà chi ha scelto chi."}, "ago_giusto": {"t": "L'Ago torna dritto, e la grande bilancia della statua si muove per la prima volta da un anno. I piatti oscillano, cercano, e si fermano in equilibrio.\n\nE Varenna parla, con una voce che è un sussurro e una sentenza insieme: «La giustizia non è un peso uguale per tutti. È il peso giusto per ciascuno.»"}, "ago_storto": {"t": "L'Ago si raddrizza solo a metà. Si muove, ma punta sempre un po' verso l'oro, come un cane che non dimentica il padrone.\n\nLa bilancia di Varenna tornerà a pesare. Ma non sarà mai più del tutto giusta."}, "purifica4": {"t": "L'orto dei profughi è libero. Resistete qui due giri: i Famelici torneranno, attirati dall'odore della terra viva."}, "orto_puro": {"t": "Le piantine di Melodoro si raddrizzano, verdi, nel mezzo della Città d'Oro. È poco. È la prima cosa viva che cresce ad Aurea da un anno.\n\nSylvara ricorda chi semina."}, "perso4": {"t": "Cadete sul marmo del Palazzo, uno dopo l'altro. L'ultima cosa che sentite è la voce di Aurelio, dolce come miele: «La Corte ha deciso.»"}, "eco_crogiolo": {"t": "Dalle Fonderie, lontano, sale il ruggito del crogiolo riacceso. Il fuoco di Pyrath arriva fino al Palazzo, e l'oro di Aurelio si incrina."}, "eco_monete": {"t": "Due Monete del Destino, una nella mano dell'altra, tintinnano da sole. Zarek gioca sempre con due monete, e non perde mai due volte."}, "end4_aula": {"t": "Quando tutto è finito, l'aula è piena di silenzio e di polvere d'oro. I giudici della Corte si guardano le mani. I profughi di Melodoro, in fondo alla sala, non se ne sono andati."}, "end4_libera": {"t": "Seraphel è libera. Si riprende la lanterna dal muro della cella, e la brace di Pyrath si riaccende tra le sue dita. «Sessant'anni» dice soltanto. «Pensavo che sarebbe stato più pesante.»"}, "end4_condannata": {"t": "Seraphel resta nelle Prigioni del Peso. Prima che la porta della cella si chiuda, vi consegna la mappa del Monte. «Andate avanti senza di me. Era questo, il piano. Lo è sempre stato.»"}, "end4_posto": {"t": "Seraphel esce dalla cella. Chi ha preso il suo posto porta adesso un peso che non si vede, ma che si sente a ogni passo. Lei non dice grazie. Dice: «Te lo restituirò.» E suona come un giuramento."}, "end4_coppa": {"t": "Alla Porta d'Oro, Sbrindello sta caricando il carretto. Quando vi vede, nasconde la coppa sotto un telo. «Niente. Non c'è niente da vedere. È una tazza.» Poi aggiunge, più piano: «Grazie.»"}, "end4_strada": {"t": "La terza Reliquia è vostra. Ne restano quattro. E sulla mappa di Vesperia, a est, le terre senza nome cominciano a uscire dalla nebbia."}, "rec_c4_inizio": {"t": "Siete arrivati ad Aurea, la Città della Bilancia. Alla porta hanno arrestato Seraphel, e le campane del Verdetto contano i giri che mancano al suo processo."}, "rec_c4_confessione": {"t": "Nelle Prigioni del Peso, Seraphel vi ha raccontato tutto: la lima, il vulcano, la Carestia Grigia. È stata lei a limare la catena."}, "rec_c4_lanzeri": {"t": "L'inquisitore Corvo Lanzeri ha letto le ricevute del Culto, e adesso cammina con voi."}};

const ARMOR = { guerriero: 3, paladino: 3, barbaro: 2, chierico: 2, ranger: 1, ladro: 1, bardo: 1, druido: 1, mago: 0 };
const LV2 = { guerriero: 6, paladino: 6, barbaro: 6, chierico: 4, ranger: 4, druido: 4, bardo: 4, ladro: 3, mago: 3 }; // Vita guadagnata al livello 2

// ---------- Capitolo 3: la Marea, le Isole Mutevoli, il Gorgo ----------
const MAREA_EVERY = 3; // giri tra un cambio di marea e il successivo
const GORGO_MAX = 5;   // il Gorgo sale a ogni cambio di marea: a 5 (circa 15 giri) il Leviatano emerge
const acquatico = h => h.razza === "acquatici";
// Zona sott'acqua: Thalassar sempre; le zone basse con l'alta marea (salvo il corallo purificato) o dopo che Vasthor è emerso
const submerged = k => S.ch === 3 && !!TILES[k] && (!!TILES[k].sub || (!!TILES[k].low && ((S.marea === "alta" && !(S.asciutto > 0)) || !!S.flags.vasthorFuori)));
const once = async k => { if (S.flags["n_" + k]) return; S.flags["n_" + k] = true; await narrate(k); };
// Entrare in una zona sommersa: chi apre la strada guida la compagnia nella corrente
async function swimIn(h, k) {
  const T = TILES[k];
  if (acquatico(h)) log(`${first(h)} guida la compagnia tra le correnti: per un Acquatico è come camminare.`);
  else {
    const guida = alive().some(acquatico) ? 2 : 0;
    const m = Math.max(mod(h.st.for), mod(h.st.agi)) + rollBonus(h) + guida + (S.flags.thessa ? 1 : 0) - (has(h, "corazza") ? 1 : 0) - (has(h, "toga") ? 1 : 0);
    const r = await check(first(h), `Nuotare verso ${T.n}${guida ? " (guida acquatica +2)" : ""}`, 12, m);
    if (!r.ok) {
      const who = alive().filter(x => !acquatico(x));
      who.forEach(x => { x.hp = Math.max(1, x.hp - 2); x.fx.breath = true; popAt(x.id, "−2", "hurt"); });
      log(`La corrente vi trascina: ${who.map(first).join(", ")} ${who.length === 1 ? "perde 2 Vita e arriva" : "perdono 2 Vita e arrivano"} senza fiato (−1 al primo tiro).`); edge("red");
    } else log(`${first(h)} trova la corrente giusta: la compagnia scivola giù senza fatica.`);
  }
  const senza = alive().filter(x => !x.collana && !acquatico(x));
  if (senza.length) { senza.forEach(x => { x.hp = Math.max(1, x.hp - 3); popAt(x.id, "−3", "hurt"); }); log(`${senza.map(first).join(", ")} senza Collana del Respiro: l'acqua brucia nei polmoni (−3 Vita).`); }
}
async function mareaChange() {
  S.marea = S.marea === "alta" ? "bassa" : "alta";
  if (S.asciutto > 0) S.asciutto--;
  S.gorgo = Math.min(GORGO_MAX, S.gorgo + 1);
  SFX.wave(); const alta = S.marea === "alta";
  const basse = GRID.flat().filter(k => TILES[k].low).map(k => TILES[k].n).join(", ");
  log(alta ? (S.asciutto > 0 ? `Alta marea, ma il corallo purificato tiene asciutte ${basse}.` : `Alta marea: ${basse} finiscono sott'acqua.`) : "Bassa marea: le zone basse riemergono.");
  log(`Il Gorgo gira più forte (${S.gorgo}/${GORGO_MAX}).`);
  banner(alta ? "Sale la marea" : "La marea si ritira", alta ? "bad" : "good");
  if (alta) swapIsles();
  if (S.gorgo >= GORGO_MAX && S.phase === "play") { S.flags.vasthorDue = true; return; }
  await once(alta ? "marea_alta" : "marea_bassa");
  if (S.gorgo === GORGO_MAX - 1) await once("gorgo_sale");
}
// Le Isole Mutevoli: a ogni alta marea due zone inesplorate del bordo si scambiano di posto
function swapIsles() {
  if (S.flags.faro) { log("La luce del faro tiene ferme le isole del bordo."); return; }
  const cells = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const k = GRID[r][c]; if (!(r === 1 && c === 1) && k !== CHAP[3].start && !TILES[k].boss && !S.tiles[k].rev) cells.push([r, c]); }
  if (cells.length < 2) return;
  const a = cells.splice(Math.floor(Math.random() * cells.length), 1)[0], b = pick(cells);
  const ka = GRID[a[0]][a[1]], kb = GRID[b[0]][b[1]];
  GRID[a[0]][a[1]] = kb; GRID[b[0]][b[1]] = ka;
  if (S.flags.thessa) { S.tiles[ka].peek = S.tiles[kb].peek = true; log(`La carta di Thessa lo aveva previsto: ${TILES[ka].n} e ${TILES[kb].n} si scambiano di posto.`); }
  else log("Nella notte d'acqua, due isole inesplorate cambiano posto.");
  banner("Le isole si spostano", "bad");
}

function recapKeys() {
  const k = ["rec_intro"], c = S.camp || {};
  if (S.ch === 1) { if (S.phase === "end") k.push(S.cittadini ? "rec_c1_salvi" : "rec_c1_persi", "rec_c1_fine"); else k.push("rec_c1_mid"); }

  }
  else if (S.ch === 3) {
    if (c.seme) k.push(c.seme === "verde" ? "rec_c2_verde" : "rec_c2_grigio");
    k.push("rec_c3_inizio");

    if (S.sigillo) k.push("rec_c3_" + S.sigillo); if (S.goccia) k.push("rec_c3_" + S.goccia);
  }
  else {

  const H = S.heroes, top = (f, min = 1) => { const b = [...H].sort((a, c) => f(c) - f(a))[0]; return f(b) >= min ? b : null; };
  const mvp = top(h => h.dmg || 0), kil = top(h => h.sx.kills), hit = top(h => h.sx.best), ang = top(h => h.sx.heal + h.sx.saves * 6), cad = top(h => h.sx.ko);

  const scelte = S.ch === 4

function ambient() {

}
function ambStart(kind) {
  const a = ac(), out = a.createGain(); out.gain.value = 0; out.connect(a.destination); AMB.out = out; out.gain.setTargetAtTime(.5, a.currentTime, 1);
  const keep = n => (AMB.nodes.push(n), n);

    const src = keep(a.createBufferSource()); src.buffer = noiseBuf(a); src.loop = true;
    const fl = keep(a.createBiquadFilter()); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = keep(a.createGain()); g.gain.value = vol;
    const lfo = keep(a.createOscillator()), lg = keep(a.createGain()); lfo.frequency.value = lfoHz; lg.gain.value = vol * .6; lfo.connect(lg).connect(g.gain);

    case "brezza": bed("bandpass", 1100, .9, .045, .07); break;
    case "acqua": bed("lowpass", 520, .7, .09, .2); every(260, () => blip(300 + Math.random() * 600, 900 + Math.random() * 600, .07, .035), .45); break;
    case "fuoco": bed("bandpass", 700, .6, .05, .5); every(90, () => crack(.06 + Math.random() * .06), .35); break;
    case "campane": bed("bandpass", 900, .8, .03, .08); every(7000, bell, .7); break;
    case "ingranaggi": { const o = keep(a.createOscillator()), g = keep(a.createGain()); o.type = "sine"; o.frequency.value = 62; g.gain.value = .035; o.connect(g).connect(out); o.start(); let n = 0; every(240, () => { crack(n++ % 4 ? .025 : .06); }); bed("bandpass", 300, .7, .03, .1); break; }

    case "risacca": bed("lowpass", 700, .6, .12, .11); bed("bandpass", 2400, .7, .02, .11); every(3200, () => blip(1500 + Math.random() * 500, 1100, .35, .02), .35); break; // onde lunghe e gabbiani lontani
