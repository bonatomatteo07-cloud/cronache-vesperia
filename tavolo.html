<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d16"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>⚔</text></svg>">
<style>html,body{margin:0;background:#0a0d16}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Tavolo di Vesperia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Spectral:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@500;600;700&display=swap">
<style>
:root{color-scheme:dark;
  --night:#0a0d16;--night2:#111626;--panel:#151b2b;--panel2:#0f1420;--line:#2a3247;
  --gold:#d9b46a;--gold-hi:#f3d793;--gold-lo:#9c7a3c;--text:#ece4d2;--muted:#9aa2b6;--dim:#6c7489;
  --good:#5cbf9b;--bad:#de6b5d;--evil:#b78cff;
  --title:"Cinzel",Georgia,serif;--serif:"Spectral",Georgia,serif;--sans:"Source Sans 3",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
body{font-family:var(--sans);font-size:15px;min-height:100vh;overflow-x:hidden;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  background:radial-gradient(90% 50% at 50% -5%,rgba(217,180,106,.13),transparent 60%),radial-gradient(70% 50% at 100% 100%,rgba(140,60,40,.16),transparent 70%),linear-gradient(var(--night2),var(--night) 70%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
img{display:block}
.lab{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.small{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--gold);border-radius:4px;padding:11px 18px;font-family:var(--title);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--gold-hi)}
.btn.main{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:#1a1408;border-color:var(--gold-hi);box-shadow:0 0 18px rgba(217,180,106,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(10,13,22,.6)}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.big{width:100%;padding:16px;font-size:16px}
.linkbtn{background:none;border:0;color:var(--gold-hi);text-decoration:underline;text-underline-offset:3px;padding:2px 6px;font-weight:600}

/* barra viste */
.viewbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;border:1px solid var(--gold-lo);border-radius:999px;overflow:hidden;background:rgba(10,13,22,.92);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.viewbar button{background:none;border:0;padding:8px 16px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.viewbar button.on{background:rgba(217,180,106,.18);color:var(--gold-hi)}

/* intro */
.intro{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px 16px;overflow:hidden}
.intro>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.38) saturate(1.1)}
.introbox{position:relative;max-width:560px;text-align:center;display:grid;gap:12px;padding:28px 24px;border:1px solid var(--gold-lo);border-radius:6px;background:rgba(10,13,22,.72);backdrop-filter:blur(4px)}
.introbox h1{font-family:var(--title);font-weight:800;font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:.05em;background:linear-gradient(180deg,#fff2c8,var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.introbox p{font-family:var(--serif);font-size:18px;line-height:1.5;margin:0;color:#ddd5c3}
.ovk{font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:700;color:var(--gold)}

/* tavolo */
.tv{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;padding:10px 14px 60px;gap:10px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand b{display:block;font-family:var(--title);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-size:15px}
.brand span{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pill{border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.03);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{color:var(--gold-hi)}
.pill.warn{border-color:var(--bad);color:#f3b2a8}
.pill.ok{border-color:var(--good);color:#a6e6cd}
.seg5{display:inline-flex;gap:2px}
.seg5 i{width:12px;height:10px;transform:skewX(-20deg);border:1px solid #6d4b2a;background:#2a1a10}
.seg5 i.on{background:linear-gradient(#ffd27a,#e0661f);border-color:#f0a050;box-shadow:0 0 6px rgba(255,140,40,.6)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:3px;padding:6px 10px;font-size:12px;font-weight:600;letter-spacing:.04em}
.tb.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(217,180,106,.12)}
.tb:disabled{opacity:.4}
.map.is3d{display:block;position:relative;padding:0;aspect-ratio:16/10;overflow:hidden}
.map.is3d .c3d{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:5px}
.m3load{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--title);letter-spacing:.1em;color:var(--gold-hi)}
.m3tag{position:absolute;left:10px;top:10px;z-index:1;font-family:var(--title);font-weight:700;letter-spacing:.06em;font-size:14px;padding:5px 10px;background:rgba(10,13,22,.8);border:1px solid var(--gold-lo);border-radius:3px;color:var(--gold-hi);pointer-events:none}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:12px;align-items:start;min-height:0}
@media (max-width:980px){.board{grid-template-columns:minmax(0,1fr)}}

/* mappa */
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px;border:1px solid var(--gold-lo);border-radius:6px;background:#0b0f19;box-shadow:inset 0 0 0 4px var(--panel2),inset 0 0 0 5px rgba(217,180,106,.25)}
.tile{position:relative;aspect-ratio:3/2;border:1px solid var(--line);border-radius:4px;overflow:hidden;padding:0;background:#0c101b;text-align:left}
.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .3s}
.tile.cov>img{filter:blur(6px) brightness(.25) grayscale(.6)}
.tile.rev>img{filter:brightness(.78)}
.tile.here{border:2px solid var(--gold);box-shadow:0 0 18px rgba(217,180,106,.35)}
.tile.here>img{filter:brightness(.95)}
.tile.goal.cov>img{filter:blur(4px) brightness(.45) sepia(.6)}
.tile.pick{cursor:pointer;border-color:var(--gold-hi);animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(243,215,147,.5)}}
.tname{position:absolute;left:0;right:0;top:0;padding:6px 8px;font-family:var(--title);font-weight:700;font-size:clamp(10px,1.2vw,14px);letter-spacing:.04em;background:linear-gradient(rgba(5,7,12,.85),transparent);color:var(--text)}
.tile.cov .tname{color:var(--muted)}
.badges{position:absolute;left:6px;bottom:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px}
.bdg{font-size:11px;font-weight:700;padding:2px 6px;border-radius:3px;background:rgba(10,13,22,.85);border:1px solid var(--line)}
.bdg.red{border-color:var(--bad);color:#f3b2a8}
.bdg.gold{border-color:var(--gold);color:var(--gold-hi)}
.party{position:absolute;right:6px;top:30px;display:flex}
.party img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:2px solid var(--gold);margin-left:-8px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pickhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--title);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:6px 12px;background:rgba(10,13,22,.88);border:1px solid var(--gold-hi);color:var(--gold-hi);border-radius:3px}

/* pannelli laterali */
.side{display:grid;gap:10px;min-width:0}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px;min-width:0}
.tks{display:flex;flex-wrap:wrap;gap:6px 4px;padding-bottom:2px}
.tk{flex:0 0 auto;display:grid;justify-items:center;gap:2px;width:58px;opacity:.85}
.tk img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:2px solid var(--gold-lo)}
.tk.tkfoe img{border-color:#7a3a3a}
.tk b{font-size:11px;color:var(--gold-hi)}
.tk span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.tk.on{opacity:1}.tk.on img{border-color:var(--gold-hi);box-shadow:0 0 12px rgba(243,215,147,.6);transform:scale(1.1)}
.tk.tkfoe.on img{border-color:var(--bad);box-shadow:0 0 12px rgba(222,107,93,.6)}
.tk.done{opacity:.35}
.roomhead{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.roomhead img{width:72px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.roomhead h3{margin:2px 0;font-family:var(--title);font-size:16px;color:var(--gold-hi)}
.roomhead p{margin:0;font-family:var(--serif);font-style:italic;font-size:14px;color:#cfc7b5;line-height:1.35}
.foe{position:relative;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:8px;border:1px solid #4a2a2a;border-radius:4px;background:rgba(80,20,20,.12);text-align:left}
.foe img{width:52px;height:64px;object-fit:cover;object-position:50% 20%;border-radius:3px}
.foe.boss{border-color:var(--evil);background:rgba(110,60,200,.12)}
.foe .pickhint{left:auto;right:8px;transform:translateY(-50%)}
.foe.pick{cursor:pointer;border-color:var(--bad);animation:glowr 1.3s infinite}
@keyframes glowr{50%{box-shadow:0 0 0 3px rgba(222,107,93,.45)}}
.fn{font-weight:700}.fn small{color:var(--muted);font-weight:600;margin-left:4px}
.fm{font-size:12px;color:var(--muted)}
.hpb{display:block;height:7px;border-radius:2px;background:#232a3c;overflow:hidden;margin:4px 0 2px}
.hpb i{display:block;height:100%;background:linear-gradient(90deg,#3e9c79,#7fdcb5);transition:width .4s}
.hpb.red i{background:linear-gradient(90deg,#a3392c,#e8765f)}
.calm{margin:0;font-family:var(--serif);font-style:italic;color:var(--muted)}
.hh{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:start}
.hh>img{width:60px;height:76px;object-fit:cover;object-position:50% 20%;border-radius:4px;border:1px solid var(--gold-lo)}
.hhi h3{margin:2px 0 0;font-family:var(--title);font-size:17px;color:var(--gold-hi)}
.sub{font-size:13px;color:var(--muted)}
.gsym{color:var(--gold-hi)}
.hpline{display:flex;align-items:center;gap:8px}.hpline .hpb{flex:1}.hpline b{font-size:13px}
.acts{display:grid;justify-items:end;gap:4px}
.acts div{display:flex;gap:4px}
.acts i{width:14px;height:14px;transform:rotate(45deg);border:1px solid var(--gold-lo)}
.acts i.on{background:linear-gradient(135deg,var(--gold-hi),var(--gold-lo));border-color:var(--gold-hi)}
.timer{font-size:12px;color:var(--gold-hi);font-weight:700}
.modebar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border:1px dashed var(--gold);border-radius:4px;color:var(--gold-hi);font-size:13px;font-weight:600}
.actgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.act{display:grid;gap:1px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.03)}
.act b{font-size:14px;color:var(--text)}
.act small{font-size:11.5px;color:var(--muted);line-height:1.25}
.act:hover:not(:disabled){border-color:var(--gold-lo);background:rgba(217,180,106,.08)}
.act.on{border-color:var(--gold);background:rgba(217,180,106,.15)}
.act:disabled{opacity:.42}
.act[data-act="bless"] b{color:var(--gold-hi)}
.endrow{display:flex;justify-content:flex-end}
.turnbox.shake{animation:shake .4s 2}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.turnbox.end h3{margin:0;font-family:var(--title);color:var(--gold-hi)}
.turnbox.end p{margin:0;font-family:var(--serif);color:#d8d0bd}
.turnbox.end ul{margin:0;padding-left:18px;color:#d8d0bd}
.logbox p{margin:0;font-family:var(--serif);font-size:14px;color:var(--muted);line-height:1.35}
.logbox p.new{color:var(--text)}

/* barra eroi */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.hc{position:relative;display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;text-align:left;padding:8px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,var(--panel),var(--panel2))}
.hc img{width:44px;height:54px;object-fit:cover;object-position:50% 20%;border-radius:3px}
.hc.cur{border-color:var(--gold);box-shadow:0 0 14px rgba(217,180,106,.3)}
.hc.ko{opacity:.75}
.hc.pick{cursor:pointer;border-color:var(--good);animation:glow 1.4s infinite}
.hn{font-weight:700}.hs,.hv{font-size:12px;color:var(--muted)}
.hitfx{animation:hitfx .5s}
@keyframes hitfx{0%{box-shadow:0 0 0 0 rgba(222,107,93,.9);transform:translateX(0)}30%{transform:translateX(-5px)}60%{transform:translateX(4px)}100%{box-shadow:0 0 0 12px rgba(222,107,93,0)}}

/* sovrapposizioni */
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,7,12,.78);backdrop-filter:blur(3px);padding:20px}
.ovbox{max-width:480px;width:100%;text-align:center;display:grid;gap:10px;padding:22px;border:1px solid var(--gold);border-radius:6px;background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:0 0 50px rgba(217,180,106,.18);animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.ovbox h3{margin:0;font-family:var(--title);font-size:26px;color:var(--gold-hi)}
.ovbox p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5;color:#ddd5c3}
.ovimg{width:150px;height:200px;object-fit:cover;object-position:50% 20%;border-radius:4px;margin:0 auto;border:1px solid var(--gold-lo)}
.ovimg.wide{width:100%;height:260px}
.ov.boss .ovbox{border-color:var(--evil);box-shadow:0 0 60px rgba(150,100,255,.35)}
.ov.boss h3{color:#e2d0ff}
.ov.dice{background:rgba(5,7,12,.55)}
.ov.dice .ovbox{max-width:320px}
.dlab{font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.06em}
.dbox{display:grid;place-items:center;height:120px}
.die{width:96px;height:96px;border-radius:16px;background:linear-gradient(145deg,#f6ecd4,#cdbd98);border:2px solid var(--gold-lo);box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 -4px 0 rgba(0,0,0,.15);display:grid;padding:14px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.die i{width:16px;height:16px;border-radius:50%;background:#2a1d10;place-self:center}
.f1 i{grid-area:2/2}
.f2 i:nth-child(1){grid-area:1/1}.f2 i:nth-child(2){grid-area:3/3}
.f3 i:nth-child(1){grid-area:1/1}.f3 i:nth-child(2){grid-area:2/2}.f3 i:nth-child(3){grid-area:3/3}
.f4 i:nth-child(1){grid-area:1/1}.f4 i:nth-child(2){grid-area:1/3}.f4 i:nth-child(3){grid-area:3/1}.f4 i:nth-child(4){grid-area:3/3}
.f5 i:nth-child(1){grid-area:1/1}.f5 i:nth-child(2){grid-area:1/3}.f5 i:nth-child(3){grid-area:2/2}.f5 i:nth-child(4){grid-area:3/1}.f5 i:nth-child(5){grid-area:3/3}
.f6 i:nth-child(1){grid-area:1/1}.f6 i:nth-child(2){grid-area:2/1}.f6 i:nth-child(3){grid-area:3/1}.f6 i:nth-child(4){grid-area:1/3}.f6 i:nth-child(5){grid-area:2/3}.f6 i:nth-child(6){grid-area:3/3}
.drow{display:flex;justify-content:center;gap:18px}
.drow .dbox:empty{display:none}
.poly{width:96px;height:96px;display:grid;place-items:center;position:relative;color:#2a1d10;font-family:var(--title);font-weight:800;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.poly::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#f6ecd4,#c9b58c)}
.poly.d20::before{clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(145deg,#ffe3a0,#d9a441)}
.poly.d8::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(145deg,#e6d6ff,#9b7be0)}
.poly span{position:relative;font-size:34px;line-height:1}
.poly em{position:absolute;bottom:14px;font-style:normal;font-family:var(--sans);font-size:10px;font-weight:700;opacity:.7}
.poly.d8 em{bottom:22px}
.dmgline{margin-top:6px;font-size:16px;color:#f3b2a8}.dmgline b{color:#ffd1c8}
.ca{font-size:12px;font-weight:700;color:var(--gold-hi);border:1px solid var(--gold-lo);border-radius:3px;padding:1px 6px;white-space:nowrap}
.pdice{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pdice .btn{font-size:18px;padding:14px 0}
.dicehelp{text-align:center;font-size:12px;color:var(--muted)}
.pdie .poly{width:72px;height:72px}.pdie .poly span{font-size:26px}
.caline{text-align:center;font-size:13px;color:var(--muted)}.caline b{color:var(--gold-hi)}
.dres{font-size:18px}.dres b{font-family:var(--title);font-size:24px;color:var(--gold-hi)}
.dres .ok{color:var(--good);font-weight:700}.dres .ko{color:var(--bad);font-weight:700}
.dres small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);color:var(--gold-hi);padding:10px 16px;border-radius:4px;z-index:40;font-weight:600}

/* effetti di colpo */
.pop{position:fixed;z-index:35;transform:translate(-50%,-50%);font-family:var(--title);font-weight:800;font-size:34px;pointer-events:none;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.8);animation:popup 2s ease-out forwards}
.pop.emo{font-family:"Spectral",Georgia,serif;font-style:italic;font-weight:700;font-size:20px;color:#1a1206;background:var(--gold-hi);border-radius:14px;padding:6px 12px;text-shadow:none;box-shadow:0 4px 18px rgba(0,0,0,.6);animation:popemo 2.8s ease-out forwards;white-space:nowrap}
@keyframes popemo{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-110%) scale(1)}80%{opacity:1;transform:translate(-50%,-130%)}100%{opacity:0;transform:translate(-50%,-150%)}}
.critline{margin-top:4px;font:700 13px/1.2 var(--title);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);text-shadow:0 0 12px rgba(255,200,110,.7)}
.pop.dmg{color:#ffd27a}.pop.hurt{color:#ff6b5a;font-size:38px}.pop.heal{color:#7fe0b5}.pop.miss{color:#c9cfdb;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}35%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.banner{position:fixed;left:50%;top:84px;z-index:34;transform:translate(-50%,-14px);opacity:0;pointer-events:none;padding:10px 26px;border-radius:4px;font-family:var(--title);font-weight:700;font-size:clamp(16px,2.2vw,24px);letter-spacing:.08em;white-space:nowrap;background:rgba(10,13,22,.92);border:1px solid var(--gold);color:var(--gold-hi);box-shadow:0 8px 30px rgba(0,0,0,.6);transition:opacity .2s,transform .2s}
.banner.show{opacity:1;transform:translate(-50%,0)}
.banner.bad{border-color:var(--bad);color:#ffb3a8;box-shadow:0 0 30px rgba(222,107,93,.45)}
.banner.good{box-shadow:0 0 30px rgba(217,180,106,.4)}
.banner.miss{border-color:#55607a;color:#c9cfdb}
.edgefx{position:fixed;inset:0;z-index:33;pointer-events:none;animation:edge .65s ease-out forwards}
.edgefx.red{box-shadow:inset 0 0 140px 30px rgba(220,40,20,.75)}
.edgefx.gold{box-shadow:inset 0 0 120px 20px rgba(255,190,80,.45)}
@keyframes edge{from{opacity:1}to{opacity:0}}
body.shakefx .tv{animation:bshake .42s}
@keyframes bshake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.hitfx{animation:hitfx .6s}
@keyframes hitfx{0%{box-shadow:0 0 0 0 rgba(255,120,90,1);filter:brightness(2.2) saturate(1.5)}30%{transform:translateX(-7px);filter:brightness(1.4)}60%{transform:translateX(5px)}100%{box-shadow:0 0 0 14px rgba(222,107,93,0);filter:none}}
/* scena di sconfitta */
.kov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 45%,rgba(60,20,10,.55),rgba(5,7,12,.9));animation:kofade .3s;cursor:pointer}
.kov.out{opacity:0;transition:opacity .25s}
@keyframes kofade{from{opacity:0}}
.kobox{display:grid;justify-items:center;gap:8px;text-align:center}
.kocard{position:relative;width:200px;height:260px;animation:kocardin .35s ease-out}
@keyframes kocardin{from{transform:scale(1.25);opacity:0}}
.half{position:absolute;inset:0;background-size:cover;background-position:50% 20%;border:2px solid var(--bad);border-radius:6px;box-shadow:0 0 40px rgba(222,107,93,.5)}
.half.l{clip-path:polygon(0 0,62% 0,38% 100%,0 100%);animation:splitl 1.7s .8s cubic-bezier(.2,.7,.3,1) forwards}
.half.r{clip-path:polygon(62% 0,100% 0,100% 100%,38% 100%);animation:splitr 1.7s .8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes splitl{0%{filter:none}20%{filter:brightness(1.8) sepia(1) hue-rotate(-20deg)}100%{transform:translate(-70px,40px) rotate(-14deg);opacity:0;filter:grayscale(1) brightness(.4)}}
@keyframes splitr{0%{filter:none}20%{filter:brightness(1.8) sepia(1) hue-rotate(-20deg)}100%{transform:translate(70px,60px) rotate(12deg);opacity:0;filter:grayscale(1) brightness(.4)}}
.slash{position:absolute;left:50%;top:-20%;width:6px;height:140%;transform:translateX(-50%) rotate(14deg) scaleY(0);transform-origin:top;background:linear-gradient(transparent,#fff6d8,#ffd27a,transparent);box-shadow:0 0 22px 6px rgba(255,210,122,.8);animation:slash .3s .45s ease-out forwards,slashout .4s .9s forwards}
@keyframes slash{to{transform:translateX(-50%) rotate(14deg) scaleY(1)}}
@keyframes slashout{to{opacity:0}}
.embers{position:absolute;left:50%;top:50%}
.embers i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px 2px rgba(255,140,40,.9);opacity:0;animation:ember 1.4s calc(.8s + var(--d)) ease-out forwards}
@keyframes ember{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
.kot{font-family:var(--title);font-weight:800;font-size:clamp(34px,6vw,58px);letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;background:linear-gradient(180deg,#fff2c8,var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(0,0,0,.8));opacity:0;animation:kot .6s .75s ease-out forwards}
@keyframes kot{from{opacity:0;letter-spacing:.8em}to{opacity:1}}
.kon{font-family:var(--title);font-size:18px;color:#f3b2a8;letter-spacing:.1em;opacity:0;animation:kofade2 .4s .95s forwards}
.kos{font-weight:700;color:var(--gold-hi);opacity:0;animation:kofade2 .4s 1.05s forwards}
.koe{font-family:var(--serif);font-style:italic;color:#d8d0bd;max-width:36ch;opacity:0;animation:kofade2 .5s 1.2s forwards}
@keyframes kofade2{to{opacity:1}}
/* telefono */
.phonewrap{min-height:100vh;display:grid;justify-items:center;align-content:start;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.phtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.phtabs button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.phtabs img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.phtabs button.on{border-color:var(--gold);color:var(--gold-hi)}
.phone{width:min(390px,100%);border-radius:36px;border:10px solid #05070c;box-shadow:0 0 0 1px var(--gold-lo),0 20px 50px rgba(0,0,0,.6);background:var(--night)}
.screen{border-radius:26px;overflow:hidden;padding:16px;display:grid;gap:10px;max-height:760px;overflow-y:auto;scrollbar-width:thin}
.phhead{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.phhead img{width:72px;height:90px;object-fit:cover;object-position:50% 20%;border-radius:4px;border:1px solid var(--gold-lo)}
.phhead h3{margin:0;font-family:var(--title);font-size:18px;color:var(--gold-hi)}
.yourturn{text-align:center;padding:6px;border:1px solid var(--gold);border-radius:4px;color:var(--gold-hi);font-weight:700;background:rgba(217,180,106,.1)}
.pdie{display:flex;justify-content:center;align-items:center;gap:14px;min-height:8px}
.pdie .die{width:64px;height:64px;padding:9px;border-radius:12px}.pdie .die i{width:11px;height:11px}
.pdie b{font-family:var(--title);font-size:30px;color:var(--gold-hi)}
.pstats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.pstats div{border:1px solid var(--line);border-radius:4px;padding:6px 2px;display:grid}
.pstats span{color:var(--gold)}.pstats b{font-family:var(--title);font-size:18px}.pstats small{font-size:10px;color:var(--muted)}
.pcard{border:1px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:3px;background:rgba(255,255,255,.02)}
.pcard p{margin:0;font-family:var(--serif);font-size:14px;color:#d0c8b6;line-height:1.4}
.pcard.obj{border-color:#8a5a2e}.pcard.obj .lab{color:#e59a5c}
.secret{border:1px solid #6b3fb3;border-radius:4px;padding:10px;background:#120e1f;display:grid;gap:6px}
.secret summary{font-family:var(--title);font-weight:700;letter-spacing:.12em;color:#d3b8ff;cursor:pointer}
.secret img{width:100%;height:120px;object-fit:cover;object-position:50% 15%;border-radius:3px}
.secret p{margin:0;font-family:var(--serif);color:#d8ccf0}
.corr{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#d3b8ff;font-size:13px}
.corr span{display:flex;gap:3px}.corr i{width:16px;height:8px;transform:skewX(-20deg);border:1px solid #6b3fb3}.corr i.on{background:#9b6be8}
.secretlbl{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.note{color:var(--dim);font-size:13px;text-align:center;margin:0;max-width:390px}

/* ===== Capitolo 2: marciume, mercante, votazione ===== */
.tile.rotten>img{filter:brightness(.55) saturate(.5) hue-rotate(40deg)}
.tile.rotten::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 70% at 50% 100%,rgba(70,90,30,.55),transparent 70%),linear-gradient(transparent 55%,rgba(20,30,10,.6));mix-blend-mode:multiply}
.tile.rotten.here>img{filter:brightness(.8) saturate(.6) hue-rotate(30deg)}
.bdg.rot{border-color:#7f9a3a;color:#c9dc8a}
.seg5.rot i{border-color:#3d4a22;background:#151a0c}
.seg5.rot i.on{background:linear-gradient(#a7c45a,#3f5418);border-color:#9bb34e;box-shadow:0 0 6px rgba(150,190,60,.55)}
.pill.gold{border-color:var(--gold-lo);color:var(--gold-hi)}
.pill small{font-size:11px;color:var(--muted)}
.rotw{color:#c9dc8a}
.fsp{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:2px}
.foe.elite{border-color:#b08a3c}
.foe.elite .fn small{color:var(--gold-hi)}
.tes{color:var(--gold-hi);font-size:12px}
.stun{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#c9dc8a;border:1px solid #6f8a32;border-radius:3px;padding:0 4px}
.act.shopact{border-color:var(--gold-lo)}
.choicerow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ovbox.wide{max-width:640px}
.quip{font-style:italic;color:#e8dcc0!important}
.kov.leaves .embers i{background:#a9c75a;box-shadow:0 0 8px 2px rgba(150,200,70,.8);border-radius:1px 6px}
/* Sbrindello entra in scena */
.ov.merch .ovbox{overflow:hidden}
.cart{width:170px;height:228px;margin:0 auto;border-radius:4px;border:1px solid var(--gold-lo);overflow:hidden;animation:cartin 1.1s cubic-bezier(.2,.8,.3,1.15) both}
.cart img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;animation:tumble 1.1s ease-out both}
.ov.merch .ovk,.ov.merch h3,.ov.merch .quip,.ov.merch .btn{animation:rise .5s ease-out both}
.ov.merch .ovk{animation-delay:.9s}.ov.merch h3{animation-delay:1s}.ov.merch .quip{animation-delay:1.25s}.ov.merch .btn{animation-delay:1.6s}
@keyframes cartin{0%{transform:translateX(-140%) rotate(-8deg)}70%{transform:translateX(6%) rotate(3deg)}85%{transform:translateX(-2%) rotate(-1deg)}100%{transform:none}}
@keyframes tumble{0%{transform:scale(1.25) rotate(-12deg)}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Votazione del tesoriere */
.voter{display:flex;align-items:center;gap:10px;justify-content:center;font-size:16px}
.voter img{width:44px;height:58px;object-fit:cover;border-radius:3px;border:1px solid var(--gold)}
.voter small{color:var(--muted)}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.cand{display:grid;gap:4px;justify-items:center;padding:10px 8px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.03);transition:transform .15s,border-color .15s}
.cand:hover,.cand:focus-visible{border-color:var(--gold);transform:translateY(-2px)}
.cand img{width:70px;height:92px;object-fit:cover;border-radius:3px}
.cand b{font-family:var(--title);color:var(--gold-hi)}
.cand small{color:var(--muted);font-size:12px}
.tally{display:grid;gap:6px;text-align:left}
.trow{display:grid;grid-template-columns:30px 90px 1fr 22px;gap:8px;align-items:center;opacity:.75}
.trow.win{opacity:1}
.trow img{width:30px;height:40px;object-fit:cover;border-radius:2px}
.tbar{height:10px;border:1px solid var(--line);border-radius:2px;background:#0b0f19;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));animation:grow .9s ease-out both}
.trow.win b{color:var(--gold-hi)}
@keyframes grow{from{width:0!important}}
/* Bottega */
.shopbox{text-align:left;gap:12px}
.shophead{display:flex;gap:12px;align-items:center}
.shophead img{width:84px;height:112px;object-fit:cover;object-position:50% 20%;border-radius:4px;border:1px solid var(--gold-lo);flex:none}
.purse{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 12px;border:1px solid var(--gold-lo);border-radius:4px;background:rgba(217,180,106,.06)}
.purse span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.purse b{font-family:var(--title);font-size:24px;color:var(--gold-hi)}
.purse small{color:var(--muted);margin-left:auto}
.tochips{display:flex;flex-wrap:wrap;gap:6px}
.tochip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.03);font-weight:600}
.tochip img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.tochip small{color:var(--muted);font-weight:400}
.tochip.on{border-color:var(--gold);background:rgba(217,180,106,.12)}
.tochip.got{animation:got .5s}
@keyframes got{40%{transform:scale(1.12);box-shadow:0 0 16px rgba(243,215,147,.6)}}
.wares{display:grid;gap:8px}
.ware{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:4px;background:rgba(10,13,22,.5)}
.ware b{font-family:var(--title);color:var(--gold-hi)}
.ware p{margin:2px 0 0;font-size:13px;line-height:1.35;color:var(--muted);font-family:var(--sans)}
.wic{width:40px;height:40px;border-radius:50%}
.wic.pozione{background:radial-gradient(circle at 40% 35%,#ffd6d0,#d0463a 45%,#5a1410 80%);box-shadow:0 0 12px rgba(220,80,60,.5)}
.wic.bomba{background:radial-gradient(circle at 35% 30%,#8a8f9e,#262a35 50%,#07080c 85%);box-shadow:0 0 0 2px #3a3326,0 -6px 10px -4px rgba(255,170,60,.8)}
/* Livello 2, capitoli, difficoltà */
.lvup{display:grid;gap:6px;text-align:left}
.lvrow{display:grid;grid-template-columns:30px 80px minmax(0,1fr) auto;gap:8px;align-items:center}
.lvrow img{width:30px;height:40px;object-fit:cover;border-radius:2px}
.lvrow span{color:#a6e6cd;font-size:14px}
.lvrow em{font-style:normal;color:var(--gold-hi);font-weight:700}
.chtabs{display:flex;justify-content:center;gap:6px}
.chtabs button,.diffrow button{border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.03);padding:6px 12px;font-weight:600;color:var(--muted)}
.chtabs button.on,.diffrow button.on{border-color:var(--gold);color:var(--gold-hi);background:rgba(217,180,106,.1)}
.diffrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.diffrow button{display:grid;gap:2px;text-align:center}
.diffrow b{font-family:var(--title)}
.diffrow small{font-size:12px;font-weight:400}
.sab{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0}
.kol{margin-top:8px;font-family:var(--title);letter-spacing:.08em;color:var(--gold-hi);font-size:15px;animation:rise .4s 1.3s both}
.kol b{color:#fff2c8}
.kol.none{color:var(--muted);font-size:13px}
.rank{display:grid;gap:5px;margin:4px 0 8px}
.rrow{display:grid;grid-template-columns:24px 80px 1fr 34px;gap:8px;align-items:center;opacity:.8}
.rrow.top{opacity:1}.rrow.top b{color:var(--gold-hi)}
.rrow img{width:24px;height:32px;object-fit:cover;border-radius:2px}
.rrow em{font-style:normal;text-align:right;font-weight:700}
.lvrow.l3{padding:4px 6px;margin:0 -6px;border:1px solid var(--gold);border-radius:4px;background:rgba(217,180,106,.1)}
.lvrow.l3 span{color:var(--gold-hi)}

/* ===== Narratore ===== */
.narr{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none;animation:rise .45s ease-out}
.narr .nbox{pointer-events:auto;max-width:820px;width:100%;background:linear-gradient(180deg,rgba(21,27,43,.97),rgba(15,20,32,.98));border:1px solid var(--gold);border-radius:6px;padding:16px 20px;box-shadow:0 12px 44px rgba(0,0,0,.65);display:grid;gap:8px}
.narr .nlab{font-family:var(--title);letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.narr .ntext p{margin:0 0 8px;font-family:var(--serif);font-size:19px;line-height:1.55;color:#efe6d0}
.narr .ntext p:last-child{margin-bottom:0}
.narr .nbar{height:3px;background:#222a3c;border-radius:2px;overflow:hidden}
.narr .nbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .2s linear}
.narr .nbtn{display:flex;justify-content:flex-end}
.narr.full{top:0;align-items:center;background:#05070c;pointer-events:auto;padding-top:24px}
.narr.full .nbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.26) saturate(1.1);animation:kenburns 120s linear both}
.narr.full .nbox{position:relative;max-width:760px;background:rgba(10,13,22,.6);border-color:var(--gold-lo);backdrop-filter:blur(2px);text-align:center}
.narr.full .nlab{font-size:clamp(22px,4vw,34px);letter-spacing:.08em;text-transform:none;font-weight:800;color:var(--gold-hi)}
.narr.full .ntext{max-height:58vh;overflow:auto;padding:4px 6px;scrollbar-width:thin}
.narr.full .ntext p{font-size:clamp(18px,2.4vw,22px);margin-bottom:14px;transition:opacity .8s}
.narr.full .ntext p.dim{opacity:.16}
.narr.full .nbtn{justify-content:center}
.narr.out{opacity:0;transition:opacity .3s}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.14)}}

.ov{overflow-y:auto}
.ovbox{max-height:calc(100dvh - 40px);overflow-y:auto}
@media (max-height:760px){.ovimg.wide{height:180px}.ovbox p{font-size:16px}}
.ovskip{justify-self:center;font-size:13px;color:var(--muted);text-decoration:underline;background:none;border:0;padding:4px}
.ov .btn:disabled{opacity:.45;filter:grayscale(.4)}

/* Campagna salvata, cronaca */
.savebox{display:grid;gap:6px;padding:12px;border:1px solid var(--gold);border-radius:5px;background:rgba(217,180,106,.08);text-align:center}
.savebox p{font-size:16px;margin:0}
.loadbox{text-align:left;font-size:13px;color:var(--muted)}
.loadbox summary{cursor:pointer;text-align:center}
.loadbox textarea{width:100%;margin:8px 0;background:#0b0f19;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px;font:12px/1.4 monospace}
.ov.cron .ovbox{max-width:720px}
.crgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left}
.crc{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.03);animation:rise .5s both}
.crc:nth-child(2){animation-delay:.12s}.crc:nth-child(3){animation-delay:.24s}.crc:nth-child(4){animation-delay:.36s}.crc:nth-child(5){animation-delay:.48s}
.crc img{width:52px;height:68px;object-fit:cover;border-radius:3px;border:1px solid var(--gold-lo)}
.crc b{display:block;font-family:var(--title);font-size:18px;color:var(--gold-hi)}
.crc span{display:block;font-size:14px}
.crc small{display:block;font-size:12px;color:var(--muted)}
.crlist{text-align:left;margin:4px 0;padding-left:18px;display:grid;gap:3px;font-size:14px}

/* ===== Armeria: drop e zaino ===== */
:root{--rare:#7fb6ff;--rare-lo:#2f4f80;--myth:#ffb347;--myth-hi:#ffe2a8;--myth-lo:#8a4a12}
.gdrop{position:fixed;inset:0;z-index:80;--c:var(--rare);background:rgba(3,5,9,0);transition:background .6s;perspective:900px}
.gdrop.myth{--c:var(--myth)}
.gdrop.s1{background:rgba(3,5,9,.78)}
.gbeam{position:absolute;left:50%;top:0;bottom:0;width:min(26vw,320px);transform:translateX(-50%) scaleX(0);opacity:0;background:linear-gradient(180deg,transparent,var(--c) 30%,var(--c) 70%,transparent);filter:blur(16px);mix-blend-mode:screen}
.s1 .gbeam{animation:gbeam 1.6s ease-out forwards}
@keyframes gbeam{25%{opacity:.85;transform:translateX(-50%) scaleX(1)}100%{opacity:.25;transform:translateX(-50%) scaleX(.6)}}
.grune{position:absolute;left:50%;top:44%;width:min(40vw,420px);aspect-ratio:1;transform:translate(-50%,-50%) rotateX(68deg) scale(0);opacity:0;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 24px var(--c),inset 0 0 24px var(--c)}
.grune::before,.grune::after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px dashed var(--c)}.grune::after{inset:30%;border-style:solid;opacity:.6}
.s1 .grune{animation:grune 3.8s ease-out .25s forwards}

  let cur = null, key = null, duck = 1, muted = false; const cache = {};

  const target = () => (muted ? 0 : (cur && cur._vol || .5) * duck);
  async function play(n, vol = .5) {
